<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2F5BD3">
<title>Picking Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A3547; --muted:#5A6A85; --line:#DFE5EF; --line2:#EEF2F7; --bg:#F0F5F9; --surface:#FFFFFF; --head:#F7F9FC;
  --pri:#2F5BD3; --pri-soft:#ECF2FF; --navy:#3E4A5C;
  --ok:#1E7A5B; --ok-dot:#2CA87F; --ok-soft:#E6F6EF; --ok-line:#A9DCC7;
  --err:#B3412A; --err-soft:#FEEDE8; --err-line:#F4C2B4;
  --warn:#7A4E00; --warn-dot:#FFAE1F; --warn-soft:#FFF4DE; --warn-line:#F5D99A;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{color:var(--muted)}
.hide{display:none!important}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:64px;flex-wrap:wrap}
.top .grow{flex:1;min-width:0}
.top h1{margin:0;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:36px;height:36px;border-radius:8px;background:var(--pri);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.chip-user{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--surface)}
.avatar{width:28px;height:28px;border-radius:999px;background:var(--navy);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}

.wrap{max-width:1400px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.btn{height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:500}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff;font-weight:500}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;padding:4px;background:var(--bg);border-radius:10px;gap:4px}
.seg button{height:40px;padding:0 14px;border:0;border-radius:8px;background:transparent;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:500}
.pill{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.pill[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:500}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;font-weight:500;white-space:nowrap}
.t-todo{background:#EEF2F7;color:var(--muted)} .t-part{background:var(--pri-soft);color:var(--pri)}
.t-done{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-err{background:var(--err-soft);color:var(--err)}
.bar{height:8px;background:#E6ECF4;border-radius:999px;overflow:hidden}.bar>div{height:100%;background:var(--pri)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted)}
.inp{height:48px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px;width:100%}
.inp:focus{outline:3px solid var(--pri-soft);border-color:var(--pri)}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login .card{width:100%;max-width:400px;padding:24px;display:flex;flex-direction:column;gap:16px}
.note{font-size:12px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}

/* PL list */
.list-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.list-head h2{margin:0;font-size:22px;font-weight:500}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pl-row{display:grid;grid-template-columns:200px minmax(0,1fr) 80px 120px 150px 170px;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line2);width:100%;text-align:left;background:var(--surface);border-left:0;border-right:0;border-top:0}
.pl-row:hover{background:#F7F9FF}
.pl-head{background:var(--head);font-size:12px;color:var(--muted);padding:10px 18px}
.pl-head:hover{background:var(--head)}
.r{text-align:right}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* scan */
.scan-grid{display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px;align-items:start}
.panel{display:flex;flex-direction:column;gap:12px;position:sticky;top:80px}
.scanbox{padding:14px;display:flex;flex-direction:column;gap:8px}
.scaninp{height:56px;border:2px solid var(--pri);border-radius:10px;padding:0 14px;font-size:16px;width:100%;outline:3px solid var(--pri-soft)}
.scaninp:disabled{border-color:var(--line);outline:0;background:#F4F6FA}
.ready{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ok)}
.ready i{width:8px;height:8px;border-radius:999px;background:var(--ok-dot);display:inline-block}
.ready.off{color:var(--err)}.ready.off i{background:var(--err)}
.fb{border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line)}
.fb .dot{width:44px;height:44px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.fb .ttl{font-size:18px;font-weight:500}
.fb .ln{font-size:13px;margin-top:2px}
.fb.ok{background:var(--ok-soft);border-color:var(--ok-line)}.fb.ok .dot{background:var(--ok)}.fb.ok .ttl{color:var(--ok)}
.fb.err{background:var(--err-soft);border-color:var(--err-line)}.fb.err .dot{background:var(--err)}.fb.err .ttl{color:var(--err)}
.fb.warn{background:var(--warn-soft);border-color:var(--warn-line)}.fb.warn .dot{background:var(--warn-dot)}.fb.warn .ttl{color:var(--warn)}
.fb.idle{background:var(--surface)}.fb.idle .dot{background:#E6ECF4}
.fb .act{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:20px;font-weight:500}.kpi .v small{font-size:13px;color:var(--muted);font-weight:400}
.btn2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.items{overflow:hidden}
.items-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.it{display:grid;grid-template-columns:44px minmax(0,1fr) 116px 130px 130px 104px;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2)}
.it.head{background:var(--head);font-size:12px;color:var(--muted)}
.it.flash{background:#F2FBF7}
.it .d1{font-size:13px;font-weight:500}.it .d2{font-size:12px;color:var(--muted)}
.camwrap{position:relative;background:#1C2433;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.camwrap .frame{position:absolute;inset:18% 12%;border:3px solid #fff;border-radius:14px;pointer-events:none}
.camwrap .msg{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:13px;padding:0 12px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(42,53,71,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:720px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal .mh{padding:18px 20px 12px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal .mb{padding:14px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:12px 20px 16px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 196px;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.stepper{display:flex;gap:6px;align-items:center}
.stepper button{width:48px;height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:22px}
.stepper input{width:88px;height:48px;border:2px solid var(--pri);border-radius:10px;text-align:center;font-size:18px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;z-index:60;font-size:14px;max-width:92vw}

/* summary */
.sum-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) 110px 120px 120px 100px;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line2);align-items:center}
.srow.head{background:var(--head);font-size:12px;color:var(--muted)}
.sec-t{margin:0;padding:12px 14px;font-size:15px;font-weight:500;border-bottom:1px solid var(--line2)}
textarea.out{width:100%;min-height:140px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px}

@media (max-width: 980px){
  .scan-grid,.sum-grid{grid-template-columns:1fr}
  .panel{position:static}
  .pl-row{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
  .pl-row.pl-head{display:none}
  .pl-row .c-lines,.pl-row .c-full{display:none}
  .it{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  .it.head{display:none}
  .it .c-no{display:none}
  .it .c-batch{grid-column:1}
  .it .c-tgt{grid-column:1;text-align:left!important}
  .it .c-done{grid-column:2;grid-row:1;text-align:right!important}
  .it .c-st{grid-column:2;grid-row:2;justify-self:end}
  .srow{grid-template-columns:minmax(0,1fr) auto}
  .srow.head{display:none}.srow .c-no{display:none}
  .erow{grid-template-columns:1fr}
  .top{padding:8px 12px}
  .wrap{padding:12px}
}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
/* Picking Checker - aplikasi (Firebase). Module script. */

/* ================= Konfigurasi ================= */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyCEpcsx-KREV0mRP8firmcgJojKjTTKUbE",
  authDomain: "picking-checker.firebaseapp.com",
  projectId: "picking-checker",
  storageBucket: "picking-checker.firebasestorage.app",
  messagingSenderId: "805609160980",
  appId: "1:805609160980:web:a973cc004e9a1e58924201"
};
var FB_VER = '13.1.0';
var CFG = {
  emailDomain: 'picking-checker.firebaseapp.com', // harus sama dengan PCHK_CFG.EMAIL_DOMAIN di GAS
  dupMsScanner: 1500,
  dupMsCamera: 2500,
  flushMs: 4000,          // kirim log scan tiap 4 detik
  flushMax: 15,           // atau tiap 15 event
  heartbeatMs: 5 * 60 * 1000,
  lockTtlMs: 30 * 60 * 1000,
  ecerSuggestRatio: 0.5
};

/* ================= Adapter Firebase ================= */
async function makeFirebaseDB() {
  var base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
  var A = await import(base + 'firebase-app.js');
  var AU = await import(base + 'firebase-auth.js');
  var F = await import(base + 'firebase-firestore.js');
  var app = A.initializeApp(FIREBASE_CONFIG);
  var auth = AU.getAuth(app);
  var db;
  try {
    db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  } catch (e) {
    db = F.getFirestore(app);
  }
  var me = null; // {uid, id, name, role}

  function emailOf(id) { return String(id).trim().toLowerCase() + '@' + CFG.emailDomain; }
  function plRef(pl) { return F.doc(db, 'picklists', pl); }
  function toMs(ts) { return ts && ts.toMillis ? ts.toMillis() : (typeof ts === 'number' ? ts : 0); }

  return {
    kind: 'firebase',
    onAuth: function (cb) {
      AU.onAuthStateChanged(auth, async function (u) {
        if (!u) { me = null; cb(null); return; }
        try {
          var snap = await F.getDoc(F.doc(db, 'checkers', u.uid));
          if (!snap.exists() || snap.data().active !== true) {
            await AU.signOut(auth); me = null;
            cb(null, 'Akun belum terdaftar atau nonaktif. Hubungi admin.');
            return;
          }
          var d = snap.data();
          me = { uid: u.uid, id: d.id, name: d.name, role: d.role };
          cb(me);
        } catch (e) {
          cb(null, 'Gagal membaca profil: ' + (e.code || e.message));
        }
      });
    },
    login: function (id, pin) { return AU.signInWithEmailAndPassword(auth, emailOf(id), pin); },
    logout: function () { return AU.signOut(auth); },
    watchPicklists: function (cb, onErr) {
      var q = F.query(F.collection(db, 'picklists'), F.where('active', '==', true));
      return F.onSnapshot(q, function (qs) {
        var list = [];
        qs.forEach(function (d) {
          var x = d.data();
          x.pl = d.id;
          x.lockAt = x.lock ? toMs(x.lock.at) : 0;
          list.push(x);
        });
        list.sort(function (a, b) { return a.pl < b.pl ? 1 : -1; });
        cb(list);
      }, onErr);
    },
    acquire: function (pl) {
      return F.runTransaction(db, async function (tx) {
        var s = await tx.get(plRef(pl));
        if (!s.exists()) throw new Error('PL tidak ditemukan');
        var lk = s.data().lock;
        if (lk && lk.uid !== me.uid && toMs(lk.at) > Date.now() - CFG.lockTtlMs) return { ok: false, by: lk.id };
        tx.update(plRef(pl), { lock: { uid: me.uid, id: me.id, at: F.serverTimestamp() }, status: 'busy' });
        return { ok: true };
      });
    },
    heartbeat: function (pl) {
      return F.updateDoc(plRef(pl), { lock: { uid: me.uid, id: me.id, at: F.serverTimestamp() } });
    },
    forceUnlock: function (pl) { return F.updateDoc(plRef(pl), { lock: null, status: 'open' }); },
    loadEvents: async function (pl) {
      var qs = await F.getDocs(F.query(F.collection(db, 'picklists', pl, 'events'), F.orderBy('at')));
      var out = [];
      qs.forEach(function (d) { (d.data().ev || []).forEach(function (e) { out.push(e); }); });
      out.sort(function (a, b) { return a.t - b.t; });
      return out;
    },
    pushEvents: function (pl, evs) {
      return F.addDoc(F.collection(db, 'picklists', pl, 'events'), { uid: me.uid, checkerId: me.id, at: F.serverTimestamp(), ev: evs });
    },
    watchPl: function (pl, cb) { return F.onSnapshot(plRef(pl), function (s) { if (s.exists()) cb(s.data()); }); },
    submit: function (pl, result, pendingEvs, status) {
      var b = F.writeBatch(db);
      if (pendingEvs.length) {
        b.set(F.doc(F.collection(db, 'picklists', pl, 'events')), { uid: me.uid, checkerId: me.id, at: F.serverTimestamp(), ev: pendingEvs });
      }
      result.uid = me.uid;
      result.checkerId = me.id;
      result.submittedAt = F.serverTimestamp();
      result.startedAt = result.startedAt ? F.Timestamp.fromMillis(result.startedAt) : null;
      result.finishedAt = F.Timestamp.fromMillis(result.finishedAt);
      result.exported = false;
      result.approved = false;
      b.set(F.doc(db, 'results', pl), result);
      b.update(plRef(pl), { lock: null, status: status });
      return b.commit();
    },
    me: function () { return me; }
  };
}

/* ================= Util ================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nf(n){return Number(n||0).toLocaleString('id-ID');}
function fmtQ(pcs,pk){
  pcs=Math.max(0,Math.round(pcs||0));
  if(!pk) return nf(pcs)+' pcs';
  var c=Math.floor(pcs/pk), r=pcs%pk;
  if(c&&r) return nf(c)+' ctn + '+nf(r)+' pcs';
  if(c) return nf(c)+' ctn';
  return nf(r)+' pcs';
}
function now(){return Date.now();}
function hhmm(t){var d=new Date(t);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);}
function $(s){return document.querySelector(s);}
var evSeq=0;
function evId(){evSeq++;return (APP.me?APP.me.id:'X')+'-'+now().toString(36)+'-'+evSeq;}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ================= Parser barcode karton =================
   ItemCode;Batch;CTN;QtyPerCtn;PCS;NoDok;Deskripsi[;Kode] */
function parseBarcode(raw){
  var s=String(raw||'').replace(/[\r\n\t]/g,'').trim();
  if(!s) return null;
  var p=s.split(';');
  if(p.length<2) return {ok:false,raw:s,why:'Tidak ada pemisah ";"'};
  var code=p[0].trim(), batch=p[1].trim().toUpperCase();
  if(!/^\d{6,}$/.test(code)) return {ok:false,raw:s,why:'ItemCode bukan angka'};
  if(!batch) return {ok:false,raw:s,why:'Batch kosong'};
  var per=p.length>3?parseFloat(p[3]):NaN;
  return {ok:true,raw:s,code:code,batch:batch,uom:(p[2]||'').trim().toUpperCase(),per:isFinite(per)&&per>0?Math.round(per):0,doc:(p[5]||'').trim()};
}

/* ================= State ================= */
var DB=null;
var APP={view:'boot',me:null,authMsg:'',pls:[],plsErr:'',pl:null,filter:'todo',q:'',mode:'ctn',input:'scanner',itemFilter:'open',
  fb:null,blocked:null,lastRaw:'',lastT:0,lastLine:null,modal:null,cam:null,typing:false,
  pending:[],flushT:null,hbT:null,unsubPl:null,unsubList:null,plHash:null,plChanged:false,busy:false,syncState:'ok'};
var SESS={};

function plById(id){for(var i=0;i<APP.pls.length;i++)if(APP.pls[i].pl===id)return APP.pls[i];return null;}
function sess(id){
  if(!SESS[id]) SESS[id]={events:[],reasons:lsGet('pchk_rs_'+id)||{},palet:1,startedAt:null,finishedAt:null,checker:null,submitted:false};
  return SESS[id];
}
function lineKey(l){return String(l.no);}
function undoneSet(s){var u={};s.events.forEach(function(e){if(e.res==='UNDO'&&e.ref)u[e.ref]=1;});return u;}
function okEvents(s){var u=undoneSet(s);return s.events.filter(function(e){return e.res==='OK'&&!u[e.id];});}
function lineDone(pl){
  var s=sess(pl.pl), pcs={}, ctn={};
  okEvents(s).forEach(function(e){ pcs[e.line]=(pcs[e.line]||0)+e.pcs; if(e.kind==='ctn') ctn[e.line]=(ctn[e.line]||0)+1; });
  return {pcs:pcs,ctn:ctn};
}
function plStats(pl){
  var d=lineDone(pl), t={lines:pl.lines.length,doneLines:0,tgtPcs:0,pcs:0,fullTgt:0,ctn:0,looseLines:0,rejected:0};
  pl.lines.forEach(function(l){
    var got=d.pcs[lineKey(l)]||0;
    t.tgtPcs+=l.qty; t.pcs+=Math.min(got,l.qty);
    if(l.pk){t.fullTgt+=Math.floor(l.qty/l.pk); if(l.qty%l.pk) t.looseLines++;}
    if(got>=l.qty) t.doneLines++;
  });
  Object.keys(d.ctn).forEach(function(k){t.ctn+=d.ctn[k];});
  sess(pl.pl).events.forEach(function(e){ if(['NOTIN','BATCH','OVER','REMAIN','FORMAT'].indexOf(e.res)>=0) t.rejected++; });
  return t;
}
function lockActive(p){return p.lock&&p.lockAt>now()-CFG.lockTtlMs;}
function plStatus(p){
  if(p.status==='done') return 'done';
  if(p.status==='diff') return 'diff';
  if(p.status==='busy'||lockActive(p)) return 'busy';
  return 'todo';
}

/* ================= Sinkron log scan ================= */
function queueEv(e){APP.pending.push(e); if(APP.pending.length>=CFG.flushMax) flush(); else if(!APP.flushT) APP.flushT=setTimeout(flush,CFG.flushMs);}
function flush(){
  clearTimeout(APP.flushT); APP.flushT=null;
  if(!APP.pending.length||!APP.pl) return Promise.resolve();
  var evs=APP.pending.splice(0), pl=APP.pl;
  APP.syncState='sending'; paintSync();
  var done=false;
  setTimeout(function(){ if(!done){APP.syncState='offline';paintSync();} },3000);
  return DB.pushEvents(pl,evs).then(function(){done=true;APP.syncState='ok';paintSync();},function(err){
    done=true; APP.syncState='error'; paintSync();
    lsSet('pchk_failed_'+pl,(lsGet('pchk_failed_'+pl)||[]).concat(evs));
    block({cls:'err',title:'Log scan gagal tersimpan ke server',lines:[(err&&err.code)||String(err),'Kemungkinan kunci PL sudah lepas (tidak aktif > 30 menit) atau akun dinonaktifkan.','Kembali ke daftar lalu buka PL lagi. Scan yang gagal disimpan di perangkat ini.'],ack:'Mengerti'});
  });
}
function paintSync(){
  var el=$('#syncState'); if(!el) return;
  var m={ok:['Tersinkron','var(--ok)'],sending:['Mengirim…','var(--muted)'],offline:['Offline: tersimpan di perangkat','var(--warn)'],error:['Gagal sinkron','var(--err)']}[APP.syncState]||['',''];
  el.textContent=m[0]; el.style.color=m[1];
}

var AC=null;
function audioInit(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();} if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
function tone(freq,ms,at){try{if(!AC)return;var o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=freq;g.gain.value=0.08;o.connect(g);g.connect(AC.destination);var t0=AC.currentTime+(at||0);o.start(t0);o.stop(t0+ms/1000);}catch(e){}}
function beep(kind){
  if(kind==='ok') tone(1500,90);
  else if(kind==='warn'){tone(900,140);tone(900,140,0.22);}
  else if(kind==='err'){tone(330,380);tone(330,380,0.5);tone(330,380,1.0);}
  try{ if(navigator.vibrate) navigator.vibrate(kind==='ok'?40:kind==='warn'?[80,60,80]:[300,100,300]); }catch(e){}
}

/* ================= Logika scan ================= */
function handleScan(raw,source){
  var pl=plById(APP.pl); if(!pl) return;
  var s=sess(pl.pl), t=now(), str=String(raw||'').trim();
  if(!str) return;
  var dupMs=source==='camera'?CFG.dupMsCamera:CFG.dupMsScanner;
  if(str===APP.lastRaw && t-APP.lastT<dupMs){
    APP.lastT=t;
    if(source!=='camera'){ setFb({cls:'warn',title:'Scan ganda diabaikan',lines:['Barcode sama dalam '+(dupMs/1000)+' detik.','Kalau memang karton berikutnya, scan lagi setelah jeda.']}); render(); }
    return;
  }
  APP.lastRaw=str; APP.lastT=t;
  if(APP.blocked){ if(source==='camera') return; beep('err'); toast('Selesaikan peringatan dulu: tekan tombol di kotak merah/kuning.'); return; }

  var b=parseBarcode(str);
  if(!b||!b.ok){ logEv(s,{raw:str,res:'FORMAT'}); block({cls:'err',title:'Barcode tidak dikenali',lines:[(b&&b.why)||'Format tidak sesuai','Isi: '+str.slice(0,80)],ack:'Mengerti'}); return; }

  var byCode=pl.lines.filter(function(l){return l.code===b.code;});
  if(!byCode.length){
    var others=APP.pls.filter(function(p){return p.pl!==pl.pl&&p.lines.some(function(l){return l.code===b.code;});}).map(function(p){return p.pl;});
    logEv(s,{raw:str,code:b.code,batch:b.batch,res:'NOTIN'});
    block({cls:'err',title:'Item tidak ada di PL ini',lines:[b.code+' · '+b.batch,others.length?('Item ini ada di PL '+others.join(', ')):'ItemCode tidak ada di PL '+pl.pl,'Kembalikan karton ke picker.'],ack:'Karton sudah dipisahkan'});
    return;
  }
  var cand=byCode.filter(function(l){return String(l.batch).toUpperCase()===b.batch;});
  if(!cand.length){
    logEv(s,{raw:str,code:b.code,batch:b.batch,res:'BATCH'});
    block({cls:'err',title:'Batch tidak sesuai',lines:[b.code+' · batch discan '+b.batch,'PL meminta batch: '+byCode.map(function(l){return l.batch;}).join(' / '),byCode[0].desc],ack:'Karton sudah dipisahkan'});
    return;
  }
  var d=lineDone(pl), line=null;
  for(var i=0;i<cand.length;i++){ if((d.pcs[lineKey(cand[i])]||0)<cand[i].qty){line=cand[i];break;} }
  if(!line) line=cand[0];
  var k=lineKey(line), got=d.pcs[k]||0, remain=line.qty-got;
  var per=b.per||line.pk;
  APP.lastLine=k;

  if(APP.mode==='pcs'){ openEcer([k],'Scan ecer: masukkan jumlah pcs'); return; }

  if(remain<=0){
    logEv(s,{raw:str,code:b.code,batch:b.batch,res:'OVER',line:k});
    block({cls:'warn',title:'Melebihi target',lines:['Baris '+line.no+' · '+line.desc,'Target '+fmtQ(line.qty,line.pk)+' sudah terpenuhi.','Keluarkan karton ini, jangan ikut dikirim.'],ack:'Karton sudah dikeluarkan'});
    return;
  }
  if(per>remain){
    logEv(s,{raw:str,code:b.code,batch:b.batch,res:'REMAIN',line:k});
    setFb({cls:'warn',title:'Karton penuh sudah lengkap',lines:['Baris '+line.no+' · batch '+line.batch,'Sisa yang dibutuhkan hanya '+nf(remain)+' pcs (isi karton '+nf(per)+').','Karton campuran/ecer: input lewat Ecer. Karton penuh: berarti lebih, keluarkan.'],
      actions:[{label:'Input ecer',fn:function(){openEcer(null,'Sisa ecer / karton campuran');}}]});
    beep('warn'); render(); return;
  }
  logEv(s,{raw:str,code:b.code,batch:b.batch,res:'OK',line:k,pcs:per,kind:'ctn'});
  var after=got+per;
  var msg=after>=line.qty?'Baris lengkap':(line.qty-after<line.pk?('Karton penuh lengkap, sisa '+nf(line.qty-after)+' pcs ecer'):('Sisa '+fmtQ(line.qty-after,line.pk)));
  setFb({cls:'ok',title:'Sesuai · +1 karton',lines:[line.desc,b.code+' · Batch '+b.batch,fmtQ(after,line.pk)+' dari '+fmtQ(line.qty,line.pk)+' · '+msg]});
  if(b.per&&line.pk&&b.per!==line.pk) toast('Catatan: isi karton di label '+b.per+', di deskripsi '+line.pk+'.');
  beep('ok'); render();
}
function logEv(s,e){
  e.id=evId(); e.t=now(); e.palet=s.palet; e.src=APP.input; e.res=e.res||'OK'; e.pcs=e.pcs||0;
  if(e.raw) e.raw=String(e.raw).slice(0,160);
  Object.keys(e).forEach(function(k){ if(e[k]===undefined) delete e[k]; });
  if(!s.startedAt) s.startedAt=e.t;
  s.events.push(e); queueEv(e);
}
function setFb(f){APP.fb=f;}
function block(f){APP.blocked=true;f.blocking=true;APP.fb=f;beep(f.cls==='err'?'err':'warn');render();}
function ack(){APP.blocked=null;APP.fb=null;render();focusScan();}
function undo(){
  var pl=plById(APP.pl),s=sess(pl.pl),oks=okEvents(s);
  if(!oks.length){toast('Belum ada scan yang bisa dibatalkan.');return;}
  var e=oks[oks.length-1];
  logEv(s,{res:'UNDO',ref:e.id,line:e.line});
  var l=pl.lines.filter(function(x){return lineKey(x)===e.line;})[0];
  toast('Dibatalkan: '+(e.kind==='ctn'?'1 karton':nf(e.pcs)+' pcs')+' · '+(l?l.desc:e.code)); APP.fb=null; render();
}

/* ================= Ecer / karton campuran ================= */
function openEcer(keys,title){
  var pl=plById(APP.pl), d=lineDone(pl);
  var rows=pl.lines.filter(function(l){var r=l.qty-(d.pcs[lineKey(l)]||0); return keys?keys.indexOf(lineKey(l))>=0:(r>0&&l.pk&&r<l.pk);});
  if(!rows.length){toast('Tidak ada sisa ecer yang terbuka.');return;}
  APP.modal={type:'ecer',title:title,keys:rows.map(lineKey),vals:{}};
  rows.forEach(function(l){APP.modal.vals[lineKey(l)]=0;});
  render();
  setTimeout(function(){var i=document.querySelector('.modal input');if(i){i.focus();i.select();}},30);
}
function mixedHint(pl,rows,d){
  var g={};
  rows.forEach(function(l){var r=l.qty-(d.pcs[lineKey(l)]||0); if(!g[l.code])g[l.code]={pk:l.pk,sum:0,n:0,b:[]}; g[l.code].sum+=r; g[l.code].n++; g[l.code].b.push(l.batch+' '+r);});
  var out=[]; Object.keys(g).forEach(function(c){var x=g[c]; if(x.n>1&&x.pk&&x.sum%x.pk===0) out.push('Item '+c+': sisa '+x.b.join(' + ')+' = '+x.sum+' pcs, pas '+(x.sum/x.pk)+' karton. Kemungkinan dipacking jadi karton campuran: buka dan hitung per batch.');});
  return out;
}
function saveEcer(){
  var pl=plById(APP.pl), s=sess(pl.pl), d=lineDone(pl), m=APP.modal, bad=[];
  m.keys.forEach(function(k){var l=pl.lines.filter(function(x){return lineKey(x)===k;})[0]; var v=Math.round(Number(m.vals[k])||0); var r=l.qty-(d.pcs[k]||0); if(v<0||v>r) bad.push('Baris '+l.no+': maks '+r+' pcs');});
  if(bad.length){toast(bad.join(' · '));return;}
  var n=0,tot=0;
  m.keys.forEach(function(k){var v=Math.round(Number(m.vals[k])||0); if(v>0){var l=pl.lines.filter(function(x){return lineKey(x)===k;})[0]; logEv(s,{raw:'ECER',code:l.code,batch:l.batch,res:'OK',line:k,pcs:v,kind:'pcs'}); n++; tot+=v;}});
  APP.modal=null;
  if(n){setFb({cls:'ok',title:'Ecer tersimpan · +'+nf(tot)+' pcs',lines:[n+' baris diperbarui.']}); beep('ok');}
  render(); focusScan();
}

/* ================= Kamera (BarcodeDetector) ================= */
function camStart(){
  var box=$('#camBox'); if(!box) return;
  var msg=function(t){var m=box.querySelector('.msg'); if(m)m.textContent=t;};
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    msg('Pemindai kamera tidak didukung di browser ini. Pakai Chrome terbaru di Android.'); return;
  }
  var fmts=['qr_code','data_matrix','code_128','pdf417','aztec'];
  Promise.resolve(BarcodeDetector.getSupportedFormats?BarcodeDetector.getSupportedFormats():fmts).then(function(sup){
    var use=fmts.filter(function(f){return sup.indexOf(f)>=0;}); var det=new BarcodeDetector({formats:use.length?use:fmts});
    return navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}).then(function(st){
      var v=box.querySelector('video'); v.srcObject=st; v.setAttribute('playsinline',''); v.play();
      APP.cam={stream:st,det:det,busy:false,timer:setInterval(function(){
        if(APP.cam.busy||v.readyState<2) return; APP.cam.busy=true;
        det.detect(v).then(function(c){APP.cam.busy=false; if(c&&c.length) handleScan(c[0].rawValue,'camera');}).catch(function(){APP.cam.busy=false;});
      },250)};
      msg('Arahkan ke barcode di label karton');
    });
  }).catch(function(e){msg('Kamera tidak bisa dibuka: '+(e&&e.message?e.message:e));});
}
function camStop(){ if(APP.cam){ clearInterval(APP.cam.timer); try{APP.cam.stream.getTracks().forEach(function(t){t.stop();});}catch(e){} APP.cam=null; } }

/* ================= Alur buka / tutup PL ================= */
async function openPl(id){
  var p=plById(id); if(!p) return;
  if(lockActive(p)&&APP.me&&p.lock.uid!==APP.me.uid){ toast('PL '+id+' sedang dicek oleh '+(p.lock.id||'checker lain')+'.'); return; }
  toast('Membuka PL '+id+'…');
  try{
    var r=await DB.acquire(id);
    if(!r.ok){ toast('PL '+id+' sedang dicek oleh '+r.by+'.'); return; }
  }catch(e){ toast('Gagal mengunci PL: '+(e.code||e.message)+'. Pastikan ada koneksi.'); return; }
  var evs=[];
  try{ evs=await DB.loadEvents(id); }catch(e){ toast('Gagal memuat log scan: '+(e.code||e.message)); }
  var s=sess(id); s.events=evs; s.submitted=false;
  s.startedAt=evs.length?evs[0].t:null;
  s.palet=evs.reduce(function(m,e){return Math.max(m,e.palet||1);},1);
  APP.pl=id; APP.view='scan'; APP.fb=null; APP.blocked=null; APP.lastLine=null; APP.lastRaw=''; APP.plChanged=false; APP.plHash=p.hash||null;
  var st=plStats(p); APP.mode=(st.looseLines>p.lines.length*CFG.ecerSuggestRatio)?'pcs':'ctn';
  if(APP.unsubPl) APP.unsubPl();
  APP.unsubPl=DB.watchPl(id,function(d){ if(APP.plHash&&d.hash&&d.hash!==APP.plHash&&!APP.plChanged){APP.plChanged=true; if(APP.view==='scan')render();} });
  startHeartbeat();
  if(evs.length) setFb({cls:'ok',title:'Melanjutkan sesi',lines:[okEvents(s).length+' scan sebelumnya dimuat.']});
  render(); window.scrollTo(0,0);
}
function leavePl(){
  flush(); camStop(); stopHeartbeat();
  if(APP.unsubPl){APP.unsubPl();APP.unsubPl=null;}
  APP.view='list'; APP.fb=null; APP.blocked=null; APP.pl=null; render();
}
function submitPl(){
  var pl=plById(APP.pl), s=sess(pl.pl), d=lineDone(pl);
  var miss=pl.lines.filter(function(l){var k=lineKey(l);return (d.pcs[k]||0)!==l.qty&&!s.reasons[k];});
  if(miss.length){toast(miss.length+' baris selisih belum diisi alasannya.');var f=document.querySelector('[data-rk="'+lineKey(miss[0])+'"]'); if(f)f.focus(); return;}
  var hasDiff=pl.lines.some(function(l){return (d.pcs[lineKey(l)]||0)!==l.qty;});
  s.finishedAt=now();
  var result={pl:pl.pl,status:hasDiff?'diff':'done',startedAt:s.startedAt,finishedAt:s.finishedAt,hash:pl.hash||'',
    lines:pl.lines.map(function(l){var k=lineKey(l);return {no:l.no,or:l.or||'',code:l.code,batch:l.batch,qty:l.qty,pcs:d.pcs[k]||0,ctn:d.ctn[k]||0,reason:(d.pcs[k]||0)!==l.qty?(s.reasons[k]||''):''};}),
    rejected:rejectedOf(s).slice(-300).map(function(e){return {t:e.t,code:e.code||'',batch:e.batch||'',res:e.res,raw:(e.raw||'').slice(0,160)};})};
  var pend=APP.pending.splice(0); clearTimeout(APP.flushT); APP.flushT=null;
  stopHeartbeat();
  var settled=false;
  s.submitted='pending'; render();
  setTimeout(function(){ if(!settled) toast('Tersimpan di perangkat, akan terkirim saat ada koneksi.'); },3000);
  DB.submit(pl.pl,result,pend,result.status).then(function(){
    settled=true; s.submitted=true; lsSet('pchk_rs_'+pl.pl,null); toast('PL '+pl.pl+' terkirim ('+(hasDiff?'ada selisih':'sesuai')+').'); if(APP.view==='sum')render();
  },function(e){
    settled=true; s.submitted=false; APP.pending=pend.concat(APP.pending); startHeartbeat();
    toast('Submit gagal: '+(e.code||e.message)); if(APP.view==='sum')render();
  });
}

function bind(){
  if(APP.view==='login'){
    on('fLogin','submit',function(e){e.preventDefault(); audioInit();
      var id=$('#uid').value.trim().toUpperCase(), pin=$('#pin').value.trim();
      if(!id||!/^\d{6}$/.test(pin)){APP.authMsg='ID wajib diisi, PIN 6 angka.';render();return;}
      APP.busy=true; APP.authMsg=''; render();
      DB.login(id,pin).then(function(){APP.busy=false;},function(err){
        APP.busy=false;
        var c=err&&err.code||'';
        APP.authMsg=(c.indexOf('invalid')>=0||c.indexOf('wrong-password')>=0||c.indexOf('user-not-found')>=0)?'ID atau PIN salah.':
          c.indexOf('too-many-requests')>=0?'Terlalu banyak percobaan. Tunggu beberapa menit.':
          c.indexOf('user-disabled')>=0?'Akun nonaktif. Hubungi admin.':
          c.indexOf('network')>=0?'Tidak ada koneksi internet.':('Gagal masuk: '+(c||err));
        render();
      });
    });
    setTimeout(function(){var u=$('#uid'); if(u&&!u.value)u.focus();},30);
    return;
  }
  if(APP.view==='list'){
    on('bOut','click',function(){DB.logout();});
    var q=$('#q'); if(q){ q.addEventListener('input',function(){APP.q=q.value; var pos=q.selectionStart; render(); var q2=$('#q'); q2.focus(); try{q2.setSelectionRange(pos,pos);}catch(e){}});
      q.addEventListener('keydown',function(e){ if(e.key==='Enter'){ var v=q.value.trim(); var p=plById(v)||APP.pls.filter(function(x){return (x.ors||[]).indexOf(v)>=0;})[0]; if(p) openPl(p.pl); else toast('PL '+v+' tidak ditemukan.'); }}); }
    each('[data-f]',function(b){b.addEventListener('click',function(){APP.filter=b.getAttribute('data-f');render();});});
    each('[data-pl]',function(b){b.addEventListener('click',function(){openPl(b.getAttribute('data-pl'));});});
    each('[data-unlock]',function(b){b.addEventListener('click',function(ev){ev.stopPropagation(); var id=b.getAttribute('data-unlock');
      DB.forceUnlock(id).then(function(){toast('Kunci PL '+id+' dilepas.');},function(e){toast('Gagal: '+(e.code||e.message));});});});
    return;
  }
  if(APP.view==='scan'){
    audioInit();
    on('bBack','click',leavePl);
    var sc=$('#scan');
    if(sc){
      sc.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key==='Tab'){ e.preventDefault(); var v=sc.value; sc.value=''; handleScan(v,'scanner'); focusScan(); }});
      sc.addEventListener('blur',function(){ setTimeout(function(){ var a=document.activeElement; if(APP.view==='scan'&&!APP.modal&&(!a||a===document.body)) focusScan(); },150); });
      var r=$('#ready'); sc.addEventListener('focus',function(){if(r){r.classList.remove('off');r.lastChild.textContent='Siap scan';}}); sc.addEventListener('blur',function(){if(r){r.classList.add('off');r.lastChild.textContent='Klik kolom scan';}});
    }
    on('bAck','click',ack);
    if(APP.fb&&APP.fb.actions) APP.fb.actions.forEach(function(x,i){var b=document.querySelector('[data-act="'+i+'"]'); if(b) b.addEventListener('click',x.fn);});
    on('bUndo','click',undo);
    on('bEcer','click',function(){openEcer(null,'Sisa ecer / karton campuran');});
    on('bSum','click',function(){camStop();flush();APP.view='sum';render();window.scrollTo(0,0);});
    on('bType','click',function(){APP.typing=!APP.typing;render();focusScan();});
    on('bPalet','click',function(){var s=sess(APP.pl); s.palet++; toast('Palet '+s.palet+' aktif. Scan berikutnya masuk palet ini.'); render(); focusScan();});
    each('[data-mode]',function(b){b.addEventListener('click',function(){APP.mode=b.getAttribute('data-mode');render();focusScan();});});
    each('[data-in]',function(b){b.addEventListener('click',function(){var v=b.getAttribute('data-in'); if(v!==APP.input){camStop();APP.input=v;render(); if(v==='camera')camStart(); else focusScan();}});});
    each('[data-if]',function(b){b.addEventListener('click',function(){APP.itemFilter=b.getAttribute('data-if');render();focusScan();});});
    if(APP.input==='camera'&&!APP.cam) camStart();
    if(APP.modal) bindModal(); else setTimeout(focusScan,10);
    return;
  }
  if(APP.view==='sum'){
    var s=sess(APP.pl);
    on('bBackScan','click',function(){ if(s.submitted){leavePl();return;} APP.view='scan';startHeartbeat();render();});
    on('bBackScan2','click',function(){APP.view='scan';render();});
    on('bToList',  'click',leavePl);
    each('[data-rk]',function(sel){sel.addEventListener('change',function(){s.reasons[sel.getAttribute('data-rk')]=sel.value; lsSet('pchk_rs_'+APP.pl,s.reasons);});});
    on('bSubmit','click',submitPl);
  }
}
function bindModal(){
  var m=APP.modal;
  on('mClose','click',function(){APP.modal=null;render();});
  on('mCancel','click',function(){APP.modal=null;render();});
  on('mSave','click',saveEcer);
  each('.modal input[data-k]',function(i){
    i.addEventListener('input',function(){m.vals[i.getAttribute('data-k')]=i.value;});
    i.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();saveEcer();}});
  });
  each('.modal [data-st]',function(b){b.addEventListener('click',function(){
    var k=b.getAttribute('data-k'), i=document.getElementById('e'+k), v=Math.max(0,(Number(i.value)||0)+Number(b.getAttribute('data-st'))); var mx=Number(i.max); if(isFinite(mx)) v=Math.min(v,mx); i.value=v; m.vals[k]=v;});});
}
var toastT=null;
function toast(t){var el=document.getElementById('toast'); if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);} el.textContent=t; el.classList.remove('hide'); clearTimeout(toastT); toastT=setTimeout(function(){el.classList.add('hide');},3200);}

/* ================= Start ================= */
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') flush(); });
window.addEventListener('pagehide',function(){ flush(); });

(async function start(){
  render();
  try{
    DB = window.PCHK_MOCK_DB || await makeFirebaseDB();
  }catch(e){
    $('#app').innerHTML='<div class="login"><div class="card" style="padding:24px">Gagal memuat Firebase: '+esc(e.message||e)+'<br>Periksa koneksi internet.</div></div>';
    return;
  }
  DB.onAuth(function(me,msg){
    if(APP.unsubList){APP.unsubList();APP.unsubList=null;}
    APP.me=me;
    if(!me){ APP.view='login'; if(msg) APP.authMsg=msg; APP.pls=[]; render(); return; }
    APP.authMsg=''; APP.view='list'; render();
    APP.unsubList=DB.watchPicklists(function(list){
      APP.pls=list; APP.plsErr='';
      if(APP.view==='list') render();
    },function(err){ APP.plsErr='Gagal memuat daftar PL: '+(err.code||err.message); if(APP.view==='list') render(); });
  });
})();

/* hook untuk diagnosa dari console browser (read-only use) */
window.__pchk = { APP: APP, CFG: CFG, SESS: SESS, sess: sess, plById: plById, lineDone: lineDone, plStats: plStats };

</script>
