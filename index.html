<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563EB">
<title>Picking Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Tema = Sell In Daily Report (EJI). Warna status: hue Sell In untuk titik/garis/latar,
     versi gelap untuk teks kecil supaya kontras >= 4.5:1 (dibaca di gudang/PDA). */
  --ink:#0B1D35; --muted:#5A6B85; --ink3:#9AA6BA; --line:#E8EDF5; --line2:#F2F5FA; --bg:#F1F4F9; --surface:#FFFFFF; --head:#F7F9FC;
  --pri:#2563EB; --pri-dk:#1D4ED8; --pri-soft:#EEF3FF; --navy:#0B1D35;
  --ok:#15803D; --ok-dot:#16A34A; --ok-soft:#E7F8EE; --ok-line:#BBE7CB;
  --err:#B91C1C; --err-dot:#DC2626; --err-soft:#FDEEEE; --err-line:#F5C2C2;
  --warn:#92400E; --warn-dot:#D97706; --warn-soft:#FEF6E7; --warn-line:#F6D9A8;
  --r:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(16,30,54,.04),0 6px 20px rgba(16,30,54,.05);
  --sh-hi:0 2px 4px rgba(16,30,54,.05),0 14px 32px rgba(16,30,54,.09);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{color:var(--muted)}
.hide{display:none!important}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:64px;flex-wrap:wrap}
.top .grow{flex:1;min-width:0}
.top h1{margin:0;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:38px;height:38px;border-radius:11px;background:var(--pri);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.chip-user{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--surface)}
.avatar{width:28px;height:28px;border-radius:999px;background:var(--navy);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}

.wrap{max-width:1400px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.btn{height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:500}
.btn.pri:hover{background:var(--pri-dk);border-color:var(--pri-dk)}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff;font-weight:500}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;padding:4px;background:var(--bg);border-radius:10px;gap:4px}
.seg button{height:40px;padding:0 14px;border:0;border-radius:8px;background:transparent;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:500}
.pill{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.pill[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:500}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;font-weight:500;white-space:nowrap}
.t-todo{background:#EEF2F8;color:var(--muted)} .t-part{background:var(--pri-soft);color:var(--pri)}
.t-done{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-err{background:var(--err-soft);color:var(--err)}
.bar{height:8px;background:#E8EDF5;border-radius:999px;overflow:hidden}.bar>div{height:100%;background:var(--pri)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted)}
.inp{height:48px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px;width:100%}
.inp:focus{outline:3px solid var(--pri-soft);border-color:var(--pri)}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login .card{width:100%;max-width:400px;padding:24px;display:flex;flex-direction:column;gap:16px}
.note{font-size:12px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}

/* PL list */
.list-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.list-head h2{margin:0;font-size:22px;font-weight:500}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pl-row{display:grid;grid-template-columns:200px minmax(0,1fr) 80px 120px 150px 170px;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line2);width:100%;text-align:left;background:var(--surface);border-left:0;border-right:0;border-top:0}
.pl-row:hover{background:#F5F8FF}
.pl-head{background:var(--head);font-size:12px;color:var(--muted);padding:10px 18px}
.pl-head:hover{background:var(--head)}
.r{text-align:right}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* scan */
.scan-grid{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;align-items:start}
.panel{display:flex;flex-direction:column;gap:12px;position:sticky;top:80px}
.scanbox{padding:14px;display:flex;flex-direction:column;gap:8px}
.scaninp{height:56px;border:2px solid var(--pri);border-radius:10px;padding:0 14px;font-size:16px;width:100%;outline:3px solid var(--pri-soft)}
.scaninp:disabled{border-color:var(--line);outline:0;background:#F1F4F9}
.ready{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ok)}
.ready i{width:8px;height:8px;border-radius:999px;background:var(--ok-dot);display:inline-block}
.ready.off{color:var(--err)}.ready.off i{background:var(--err)}
.fb{border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line)}
.fb .dot{width:44px;height:44px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.fb .ttl{font-size:18px;font-weight:500}
.fb .ln{font-size:13px;margin-top:2px}
.fb.ok{background:var(--ok-soft);border-color:var(--ok-line)}.fb.ok .dot{background:var(--ok)}.fb.ok .ttl{color:var(--ok)}
.fb.err{background:var(--err-soft);border-color:var(--err-line)}.fb.err .dot{background:var(--err)}.fb.err .ttl{color:var(--err)}
.fb.warn{background:var(--warn-soft);border-color:var(--warn-line)}.fb.warn .dot{background:var(--warn-dot)}.fb.warn .ttl{color:var(--warn)}
.fb.idle{background:var(--surface)}.fb.idle .dot{background:#E8EDF5}
.fb .act{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:20px;font-weight:500}.kpi .v small{font-size:13px;color:var(--muted);font-weight:400}
.btn2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.items,.ctable{overflow:hidden;container-type:inline-size}
.items-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.it{display:grid;grid-template-columns:40px minmax(160px,1fr) 108px 112px 112px 150px;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2)}
.it .c-of{display:none}
.it.head{background:var(--head);font-size:12px;color:var(--muted)}
.it.flash{background:#F0FAF4}
.it.bad{background:#FEF6F6}
.it-grp{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;font-weight:500;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line2);letter-spacing:.02em}
.it-grp span{font-weight:400;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 8px}
.it-grp.g-prog{color:var(--pri)}.it-grp.g-err{color:var(--err)}.it-grp.g-done{color:var(--ok)}
.tab.t-err .cnt{background:var(--err-soft);color:var(--err)}
.tabs.in{gap:0}@container (min-width: 561px){.tabs.in{flex-wrap:wrap;overflow:visible}}.tabs.in .tab{padding:0 8px;gap:6px;font-size:13px}
.it .d3{font-size:12px;color:var(--err);font-weight:500}
.it.t8{grid-template-columns:36px minmax(150px,1fr) 96px 104px 76px 64px 112px 136px;gap:10px}
.it .tdet{display:none;font-size:12px;color:var(--muted)}
/* No item: kolom sendiri di layar lebar/menengah, teks kecil "No 33 ·" di layar sempit */
.mno{display:none}
.it .c-tp,.it .c-td{color:var(--ink)}
.it .dpcs{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.it.t8 .d1{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.it .dg{font-size:11px;color:var(--pri);font-weight:500}
.palrow2{display:flex;flex-direction:column;gap:8px;margin:12px 0 10px;padding-top:12px;border-top:1px solid var(--line2)}
.pals,.pvbar{display:flex;flex-wrap:wrap;gap:6px}
.pvbar{padding:10px 14px;border-bottom:1px solid var(--line2)}
.pal{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;height:48px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;cursor:pointer;line-height:1.1}
.pal b{font-size:15px;font-weight:500}.pal small{font-size:11px;color:var(--muted)}
.pal[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}.pal[aria-pressed="true"] small{color:#DCE7FF}
.pal.add{border-style:dashed;color:var(--pri);font-size:16px}
.pal.sm{flex-direction:row;height:34px;min-width:0;font-size:13px}
.pal .palr{font-size:10px;color:var(--err);line-height:1}
.pal[aria-pressed="true"] .palr{color:#FFE1E1}
.pal{height:auto;min-height:48px;padding:4px 8px}
.lg.rg{grid-template-columns:96px minmax(160px,1fr) 100px 150px 90px 72px}
.lg .mres{display:none;color:var(--err);font-weight:500}
.lg .dpcs{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.chip.sap{background:#fff;border:1px solid var(--line);color:var(--ink);gap:6px;padding:0 8px 0 4px;font-weight:400}
.chip.sap .sap-k{font-size:10px;font-weight:500;letter-spacing:.04em;padding:1px 5px;border-radius:4px;background:#EEF2F8;color:var(--muted)}
.chip.sap-r .sap-k{background:var(--pri-soft);color:var(--pri)}
.chip.sap-y .sap-k{background:var(--ok-soft);color:var(--ok)}
.chip.sap-p .sap-k{background:var(--warn-soft);color:var(--warn)}
.chip.sap-c{color:var(--muted)}
.pl-top{flex-wrap:wrap}
.c-st{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rbtn{height:28px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap}
.rbtn:hover{border-color:var(--err-line);color:var(--err)}
.rbtn.on{background:var(--err-dot);border-color:var(--err-dot);color:#fff;font-weight:500}
.c-act{display:flex;justify-content:flex-end}
.xbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;margin:10px 0 6px}
.xchk{display:flex;gap:8px;align-items:center;cursor:pointer}
.xlist{max-height:46vh;overflow:auto;border:1px solid var(--line2);border-radius:10px}
.xrow{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line2);font-size:13px;cursor:pointer}
.xrow:last-child{border-bottom:0}.xrow:hover{background:var(--pri-soft)}
.xrow input,.xchk input{width:18px;height:18px;accent-color:var(--pri);flex:none}
.xpl{font-weight:500;white-space:nowrap}
.btn svg{flex:none}
.sapf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-2px 0 12px}
.sapf-l{font-size:12px;color:var(--muted);margin-right:4px}
.sapf .pal.sm{gap:6px;padding:0 10px}
.sapf .cnt{font-size:11px;background:#EEF2F8;color:var(--muted);padding:0 7px;border-radius:999px}
.sapf .pal[aria-pressed="true"] .cnt{background:rgba(255,255,255,.22);color:#fff}
.ctnnote{display:flex;gap:8px;align-items:center;margin-top:10px;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:500}
.ctnnote i{width:8px;height:8px;border-radius:999px;flex:none;background:currentColor}
.ctnnote.c-ok{background:var(--ok-soft);color:var(--ok)}.ctnnote.c-warn{background:var(--warn-soft);color:var(--warn)}
.ctnnote.c-err{background:var(--err-soft);color:var(--err)}.ctnnote.c-n{background:#EEF2F8;color:var(--muted)}
.kpi .ks{font-size:12px;font-weight:500;margin-top:2px}
.kpi.kc-ok .ks{color:var(--ok)}.kpi.kc-warn .ks{color:var(--warn)}.kpi.kc-err .ks{color:var(--err)}.kpi.kc-n .ks{color:var(--muted)}
.kpi.kc-ok{border-color:#BBE7CB}.kpi.kc-warn{background:var(--warn-soft);border-color:#F6D9A8}
.iqrow{position:relative;display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2)}
.iqico{position:absolute;left:26px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex}
.inp.iq{height:40px;padding-left:36px;font-size:14px;flex:1;min-width:0}
.iqx{height:40px;width:40px;padding:0;font-size:20px;line-height:1}
.inp.iq::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.iqinfo{padding:8px 14px;font-size:12px;color:var(--muted);background:var(--pri-soft);border-bottom:1px solid var(--line2)}
.sepok{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--warn-line,#F6D9A8);background:var(--warn-soft);border-radius:10px;cursor:pointer}
.sepok input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--ok)}
.sepok b{display:block;font-weight:500;font-size:14px;color:var(--ink)}
.sepok small{display:block;font-size:12px;color:var(--warn);margin-top:2px;line-height:1.4}
.sepok.on{background:var(--ok-soft);border-color:#BBE7CB}.sepok.on small{color:var(--ok)}
.sepok.need{outline:2px solid var(--err);outline-offset:2px}
.kbtn{border:1px solid transparent;background:none;text-align:left;border-radius:8px;cursor:pointer;color:inherit;font:inherit;margin:-6px;padding:6px!important}
.kbtn:hover{background:var(--pri-soft)}
.kbtn[aria-pressed="true"]{background:var(--pri-soft);border-color:var(--pri)}
.kbtn .l span{color:var(--pri)}
.lg{display:grid;grid-template-columns:76px minmax(160px,1fr) 108px 150px 56px 72px;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line2);font-size:13px}
.lg.head{background:var(--head);font-size:12px;color:var(--muted)}
.lg .d1{font-size:13px;font-weight:500}.lg .d2{font-size:12px;color:var(--muted)}
.it .d1{font-size:13px;font-weight:500}.it .d2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camwrap{position:relative;background:#0B1D35;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.camwrap .frame{position:absolute;inset:18% 12%;border:3px solid #fff;border-radius:14px;pointer-events:none}
.camwrap .msg{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:13px;padding:0 12px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(42,53,71,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:720px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal .mh{padding:18px 20px 12px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal .mb{padding:14px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:12px 20px 16px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 196px;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.stepper{display:flex;gap:6px;align-items:center}
.stepper button{width:48px;height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:22px}
.stepper input{width:88px;height:48px;border:2px solid var(--pri);border-radius:10px;text-align:center;font-size:18px}
.unlock{position:absolute;right:12px;bottom:6px;height:32px;font-size:12px}
@media (max-width: 600px){
  .chip-name{display:none}.chip-user{padding:4px}.btn-out{height:44px;padding:0 12px}.top h1{font-size:16px}
  .top-scan .grow{flex:1 1 calc(100% - 60px)}
  .top-scan .seg{flex:1 1 0}
  .top-scan .seg button{flex:1;padding:0 6px}
  .top-scan #syncState{order:10;width:100%;text-align:right;font-size:11px}
  .items-top .seg{overflow-x:auto;max-width:100%}
  .items-top .seg button{white-space:nowrap}
  .btn2 .btn{font-size:13px;padding:0 10px}
}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;z-index:60;font-size:14px;max-width:92vw}

/* summary */
.sum-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.srow{display:grid;grid-template-columns:40px minmax(160px,1fr) 104px 108px 108px 96px;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line2);align-items:center}
.srow.head{background:var(--head);font-size:12px;color:var(--muted)}
.sec-t{margin:0;padding:12px 14px;font-size:15px;font-weight:500;border-bottom:1px solid var(--line2)}
textarea.out{width:100%;min-height:140px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px}


/* tabel menyesuaikan lebar panelnya sendiri (bukan lebar layar) */
@container (max-width: 760px){
  .it{grid-template-columns:minmax(140px,1fr) 92px 104px 88px 82px;gap:8px;padding:10px 12px}
  .it .c-no{display:none}
  .it .d1{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
  .srow{grid-template-columns:minmax(140px,1fr) 92px 100px 92px 84px;gap:8px;padding:10px 12px}
  .srow .c-no{display:none}
  .it:not(.t8) .mno,.srow .mno{display:inline}
}
@container (max-width: 880px){
  /* No tetap kolom sendiri; Total pcs & Ctn pindah ke baris kecil di bawah nama (tanpa geser ke samping) */
  .it.t8{grid-template-columns:30px minmax(110px,1fr) 84px 100px 104px 120px;gap:8px;padding:10px}
  .it.t8 .c-no{display:block}
  .it.t8 .c-tp,.it.t8 .c-td{display:none}
  .it.t8 .tdet{display:block}
  .it.t8 .d1{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
}
@container (max-width: 560px){
  .it.t8{grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px}
  .it.t8 .c-tgt,.it.t8 .c-no,.it.t8 .c-tp,.it.t8 .c-td{display:none}
  .it .mno,.srow .mno{display:inline}
  .it.t8 .tdet{display:block}
  .lg{grid-template-columns:62px minmax(0,1fr) auto auto;gap:2px 10px}

<div id="app"></div>
<script type="module">
/* Picking Checker - aplikasi (Firebase). Module script. */

/* ================= Konfigurasi ================= */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyCEpcsx-KREV0mRP8firmcgJojKjTTKUbE",
  authDomain: "picking-checker.firebaseapp.com",
  projectId: "picking-checker",
  storageBucket: "picking-checker.firebasestorage.app",
  messagingSenderId: "805609160980",
  appId: "1:805609160980:web:a973cc004e9a1e58924201"
};
var FB_VER = '13.1.0';
var CFG = {
  emailDomain: 'picking-checker.firebaseapp.com', // harus sama dengan PCHK_CFG.EMAIL_DOMAIN di GAS
  dupMsScanner: 0,          // 0 = tanpa jeda; scan barcode sama berturut-turut dihitung semua
  dupMsCamera: 2500,
  flushMs: 4000,          // kirim log scan tiap 4 detik
  flushMax: 15,           // atau tiap 15 event
  heartbeatMs: 5 * 60 * 1000,
  lockTtlMs: 30 * 60 * 1000,
  ecerSuggestRatio: 0.5
};

/* ================= Adapter Firebase ================= */
async function makeFirebaseDB() {
  var base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
  var A = await import(base + 'firebase-app.js');
  var AU = await import(base + 'firebase-auth.js');
  var F = await import(base + 'firebase-firestore.js');
  var app = A.initializeApp(FIREBASE_CONFIG);
  var auth = AU.getAuth(app);
  var db;
  try {
    db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  } catch (e) {
    db = F.getFirestore(app);
  }
  var me = null; // {uid, id, name, role}

  function emailOf(id) { return String(id).trim().toLowerCase() + '@' + CFG.emailDomain; }
  function plRef(pl) { return F.doc(db, 'picklists', pl); }
  function toMs(ts) { return ts && ts.toMillis ? ts.toMillis() : (typeof ts === 'number' ? ts : 0); }

  return {
    kind: 'firebase',
    onAuth: function (cb) {
      AU.onAuthStateChanged(auth, async function (u) {
        if (!u) { me = null; cb(null); return; }
        try {
          var snap = await F.getDoc(F.doc(db, 'checkers', u.uid));
          if (!snap.exists() || snap.data().active !== true) {
            await AU.signOut(auth); me = null;
            cb(null, 'Akun belum terdaftar atau nonaktif. Hubungi admin.');
            return;
          }
          var d = snap.data();
          me = { uid: u.uid, id: d.id, name: d.name, role: d.role };
          cb(me);
        } catch (e) {
          cb(null, 'Gagal membaca profil: ' + (e.code || e.message));
        }
      });
    },
    login: function (id, pin) { return AU.signInWithEmailAndPassword(auth, emailOf(id), pin); },
    logout: function () { return AU.signOut(auth); },
    watchPicklists: function (cb, onErr) {
      var q = F.query(F.collection(db, 'picklists'), F.where('active', '==', true));
      return F.onSnapshot(q, function (qs) {
        var list = [];
        qs.forEach(function (d) {
          var x = d.data();
          x.pl = d.id;
          x.lockAt = x.lock ? toMs(x.lock.at) : 0;
          list.push(x);
        });
        list.sort(function (a, b) { return a.pl < b.pl ? 1 : -1; });
        cb(list);
      }, onErr);
    },
    acquire: function (pl) {
      return F.runTransaction(db, async function (tx) {
        var s = await tx.get(plRef(pl));
        if (!s.exists()) throw new Error('PL tidak ditemukan');
        var lk = s.data().lock;
        if (lk && lk.uid !== me.uid && toMs(lk.at) > Date.now() - CFG.lockTtlMs) return { ok: false, by: lk.id };
        // status tetap; berubah jadi "busy" saat scan pertama (field status wajib ada menurut rules)
        tx.update(plRef(pl), { lock: { uid: me.uid, id: me.id, at: F.serverTimestamp() }, status: s.data().status || 'open' });
        return { ok: true };
      });
    },
    heartbeat: function (pl) {
      return F.updateDoc(plRef(pl), { lock: { uid: me.uid, id: me.id, at: F.serverTimestamp() } });
    },
    setStatus: function (pl, st) {
      return F.updateDoc(plRef(pl), { lock: { uid: me.uid, id: me.id, at: F.serverTimestamp() }, status: st });
    },
    release: function (pl, st) { return F.updateDoc(plRef(pl), { lock: null, status: st || 'open' }); },
    forceUnlock: function (pl) { return F.updateDoc(plRef(pl), { lock: null, status: 'open' }); },
    loadEvents: async function (pl) {
      var qs = await F.getDocs(F.query(F.collection(db, 'picklists', pl, 'events'), F.orderBy('at')));
      var out = [];
      qs.forEach(function (d) { (d.data().ev || []).forEach(function (e) { out.push(e); }); });
      out.sort(function (a, b) { return a.t - b.t; });
      return out;
    },
    pushEvents: function (pl, evs) {
      return F.addDoc(F.collection(db, 'picklists', pl, 'events'), { uid: me.uid, checkerId: me.id, at: F.serverTimestamp(), ev: evs });
    },
    watchPl: function (pl, cb) { return F.onSnapshot(plRef(pl), function (s) { if (s.exists()) cb(s.data()); }); },
    submit: function (pl, result, pendingEvs, status) {
      var b = F.writeBatch(db);
      if (pendingEvs.length) {
        b.set(F.doc(F.collection(db, 'picklists', pl, 'events')), { uid: me.uid, checkerId: me.id, at: F.serverTimestamp(), ev: pendingEvs });
      }
      result.uid = me.uid;
      result.checkerId = me.id;
      result.submittedAt = F.serverTimestamp();
      result.startedAt = result.startedAt ? F.Timestamp.fromMillis(result.startedAt) : null;
      result.finishedAt = F.Timestamp.fromMillis(result.finishedAt);
      result.exported = false;
      result.approved = false;
      b.set(F.doc(db, 'results', pl), result);
      b.update(plRef(pl), { lock: null, status: status });
      return b.commit();
    },
    /** Hasil pengecekan. ids = daftar PL, atau null untuk semua hasil. Waktu dikembalikan dalam ms. */
    getResults: async function (ids) {
      var out = [];
      function norm(id, x) { x.pl = x.pl || id; ['startedAt', 'finishedAt', 'submittedAt'].forEach(function (k) { x[k] = toMs(x[k]); }); return x; }
      if (ids) {
        for (var i = 0; i < ids.length; i += 20) {
          var snaps = await Promise.all(ids.slice(i, i + 20).map(function (id) { return F.getDoc(F.doc(db, 'results', id)); }));
          snaps.forEach(function (sn) { if (sn.exists()) out.push(norm(sn.id, sn.data())); });
        }
      } else {
        var qs = await F.getDocs(F.collection(db, 'results'));
        qs.forEach(function (d) { out.push(norm(d.id, d.data())); });
      }
      return out;
    },
    me: function () { return me; }
  };
}

/* ================= Util ================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nf(n){return Number(n||0).toLocaleString('id-ID');}
function ctnDec(pcs,pk){ if(!pk) return '-'; return (Math.round(pcs/pk*100)/100).toLocaleString('id-ID',{maximumFractionDigits:2})+' ctn'; }
function fmtQ(pcs,pk){
  pcs=Math.max(0,Math.round(pcs||0));
  if(!pk) return nf(pcs)+' pcs';
  var c=Math.floor(pcs/pk), r=pcs%pk;
  if(c&&r) return nf(c)+' ctn + '+nf(r)+' pcs';
  if(c) return nf(c)+' ctn';
  return nf(r)+' pcs';
}
function now(){return Date.now();}
function hhmm(t){var d=new Date(t);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);}
function $(s){return document.querySelector(s);}
var evSeq=0;
function evId(){evSeq++;return (APP.me?APP.me.id:'X')+'-'+now().toString(36)+'-'+evSeq;}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ================= Parser barcode karton =================
   ItemCode;Batch;CTN;QtyPerCtn;PCS;NoDok;Deskripsi[;Kode] */
function parseBarcode(raw){
  var s=String(raw||'').replace(/[\r\n\t]/g,'').trim();
  if(!s) return null;
  var p=s.split(';');
  if(p.length<2) return {ok:false,raw:s,why:'Tidak ada pemisah ";"'};
  var code=p[0].trim(), batch=p[1].trim().toUpperCase();
  if(!/^\d{6,}$/.test(code)) return {ok:false,raw:s,why:'ItemCode bukan angka'};
  if(!batch) return {ok:false,raw:s,why:'Batch kosong'};
  var per=p.length>3?parseFloat(p[3]):NaN;
  return {ok:true,raw:s,code:code,batch:batch,uom:(p[2]||'').trim().toUpperCase(),per:isFinite(per)&&per>0?Math.round(per):0,doc:(p[5]||'').trim()};
}

/* ================= State ================= */
var DB=null;
var APP={view:'boot',me:null,authMsg:'',pls:[],plsErr:'',pl:null,filter:'all',sapF:'all',q:'',mode:'ctn',input:'scanner',itemFilter:'all',palView:'all',iq:'',iqFocus:false,
  fb:null,blocked:null,lastRaw:'',lastT:0,lastLine:null,modal:null,cam:null,typing:false,
  pending:[],flushT:null,hbT:null,unsubPl:null,unsubList:null,plHash:null,plChanged:false,busy:false,syncState:'ok'};
var SESS={};

function plById(id){for(var i=0;i<APP.pls.length;i++)if(APP.pls[i].pl===id)return ensureKeys(APP.pls[i]);return null;}
function sess(id){
  if(!SESS[id]) SESS[id]={events:[],reasons:lsGet('pchk_rs_'+id)||{},palet:1,palCount:1,startedAt:null,finishedAt:null,checker:null,submitted:false};
  return SESS[id];
}
/* Kunci baris PL. "No" dari SAP/Sheet TIDAK selalu unik dalam satu PL (mis. baris lama yang tertinggal
   setelah PL diubah di SAP), jadi kunci = No + ItemCode + Batch (+ nomor urut bila tetap kembar). */
function baseKey(l){return (String(l.no)+'_'+String(l.code||'')+'_'+String(l.batch||'')).replace(/[^A-Za-z0-9_-]/g,'-');}
function ensureKeys(pl){
  if(!pl||!pl.lines||pl._kd) return pl;
  var seen={};
  pl.lines.forEach(function(l){var k=baseKey(l); seen[k]=(seen[k]||0)+1; l._k=seen[k]>1?(k+'_'+seen[k]):k;});
  pl._kd=true; return pl;
}
function lineKey(l){return l._k||baseKey(l);}
/** Event lama menyimpan line = No saja. Petakan ke kunci baru lewat No + ItemCode + Batch. */
function migrateLineRefs(pl,s){
  ensureKeys(pl);
  var keys={}, byNo={};
  pl.lines.forEach(function(l){keys[l._k]=1; (byNo[String(l.no)]=byNo[String(l.no)]||[]).push(l);});
  function byCB(code,batch){ var B=String(batch||'').toUpperCase(); var m=pl.lines.filter(function(l){return l.code===code&&String(l.batch).toUpperCase()===B;})[0]; return m?m._k:null; }
  function map(old,code,batch){
    if(old==null||keys[old]) return old;
    var c=byNo[String(old)]; if(!c||!c.length) return (code&&byCB(code,batch))||old;
    if(c.length===1) return c[0]._k;
    var B=String(batch||'').toUpperCase();

/**

function itemAgg(lines,gotOf){

    if(!g[c]){ g[c]={qty:0,got:0,pk:l.pk||0,done:true,perLine:0}; order.push(c); }
    var x=g[c], got=gotOf?Math.min(gotOf(l)||0,l.qty):0;

    if(l.pk) x.perLine+=Math.floor(l.qty/l.pk); });

  order.forEach(function(c){var x=g[c]; if(x.done) t.doneItems++; if(x.pk){ t.ctnTgt+=Math.floor(x.qty/x.pk); t.ctnGot+=Math.floor(x.got/x.pk); if(x.got<x.qty) t.mixed+=Math.floor(x.qty/x.pk)-x.perLine; }});

}

  t.lines=a.items; t.doneLines=a.doneItems; t.fullTgt=a.ctnTgt; t.ctn=a.ctnGot; t.mixedCtn=a.mixed;

}

/* ================= Logika scan ================= */
function handleScan(raw,source){
  var pl=plById(APP.pl); if(!pl) return;
  var s=sess(pl.pl), t=now(), str=String(raw||'').trim();
  if(!str) return;
  var dupMs=source==='camera'?CFG.dupMsCamera:CFG.dupMsScanner;
  if(str===APP.lastRaw && t-APP.lastT<dupMs){
    APP.lastT=t;
    if(source!=='camera'){ setFb({cls:'warn',title:'Scan ganda diabaikan',lines:['Barcode sama dalam '+(dupMs/1000)+' detik.','Kalau memang karton berikutnya, scan lagi setelah jeda.']}); render(); }
    return;
  }
  APP.lastRaw=str; APP.lastT=t;
  if(APP.blocked){ if(source==='camera') return; beep('err'); toast('Selesaikan peringatan dulu: tekan tombol di kotak merah/kuning.'); return; }

  var b=parseBarcode(str);
  if(!b||!b.ok){ logEv(s,{raw:str,res:'FORMAT'}); flag({cls:'err',title:'Barcode tidak dikenali',lines:[(b&&b.why)||'Format tidak sesuai','Isi: '+str.slice(0,80),'Pisahkan karton ini. Scan berikutnya bisa langsung dilanjutkan.']}); return; }

  var byCode=pl.lines.filter(function(l){return l.code===b.code;});
  if(!byCode.length){
    var others=APP.pls.filter(function(p){return p.pl!==pl.pl&&p.lines.some(function(l){return l.code===b.code;});}).map(function(p){return p.pl;});
    logEv(s,{raw:str,code:b.code,batch:b.batch,res:'NOTIN'});
    flag({cls:'err',title:'Item tidak ada di PL ini',lines:[b.code+' · '+b.batch,others.length?('Item ini ada di PL '+others.join(', ')):'ItemCode tidak ada di PL '+pl.pl,'Kembalikan karton ke picker.','Pisahkan karton ini. Scan berikutnya bisa langsung dilanjutkan.']});
    return;
  }
  var cand=byCode.filter(function(l){return String(l.batch).toUpperCase()===b.batch;});
  if(!cand.length){
    logEv(s,{raw:str,code:b.code,batch:b.batch,res:'BATCH',line:lineKey(byCode[0])});
    flag({cls:'err',title:'Batch tidak sesuai',lines:[b.code+' · batch discan '+b.batch,'PL meminta batch: '+byCode.map(function(l){return l.batch;}).join(' / '),byCode[0].desc,'Pisahkan karton ini. Scan berikutnya bisa langsung dilanjutkan.']});
    return;
  }
  var d=lineDone(pl), line=null;
  for(var i=0;i<cand.length;i++){ if((d.pcs[lineKey(cand[i])]||0)<cand[i].qty){line=cand[i];break;} }
  if(!line) line=cand[0];
  var k=lineKey(line), got=d.pcs[k]||0, remain=line.qty-got;
  var per=b.per||line.pk;
  APP.lastLine=k;

  if(APP.mode==='pcs'){ openEcer([k],'Scan ecer: masukkan jumlah pcs'); return; }

  if(remain<=0){
    logEv(s,{raw:str,code:b.code,batch:b.batch,res:'OVER',line:k});
    flag({cls:'err',title:'Melebihi target',lines:['Item '+line.no+' · '+line.desc,'Target '+fmtQ(line.qty,line.pk)+' sudah terpenuhi.','Keluarkan karton ini, jangan ikut dikirim. Scan berikutnya bisa langsung dilanjutkan.']});
    return;
  }
  if(per>remain){
    logEv(s,{raw:str,code:b.code,batch:b.batch,res:'REMAIN',line:k});
    setFb({cls:'warn',title:'Karton penuh sudah lengkap',lines:['Item '+line.no+' · batch '+line.batch,'Sisa yang dibutuhkan hanya '+nf(remain)+' pcs (isi karton '+nf(per)+').','Karton campuran/ecer: input lewat Ecer. Karton penuh: berarti lebih, keluarkan.'],
      actions:[{label:'Input ecer',fn:function(){openEcer(null,'Sisa ecer / karton campuran');}}]});
    beep('warn'); render(); return;
  }
  logEv(s,{raw:str,code:b.code,batch:b.batch,res:'OK',line:k,pcs:per,kind:'ctn'});
  var after=got+per;
  var msg=after>=line.qty?'Item lengkap':(line.qty-after<line.pk?('Karton penuh lengkap, sisa '+nf(line.qty-after)+' pcs ecer'):('Sisa '+fmtQ(line.qty-after,line.pk)));
  setFb({cls:'ok',title:'Sesuai · +1 karton',lines:[line.desc,b.code+' · Batch '+b.batch,fmtQ(after,line.pk)+' dari '+fmtQ(line.qty,line.pk)+' · '+msg]});
  if(b.per&&line.pk&&b.per!==line.pk) toast('Catatan: isi karton di label '+b.per+', di deskripsi '+line.pk+'.');
  beep('ok'); render();
}
function logEv(s,e){

function openEcer(keys,title){
  var pl=plById(APP.pl), d=lineDone(pl);
  var ecerGot={}; okEvents(sess(pl.pl)).forEach(function(e){ if(e.kind!=='ctn') ecerGot[e.line]=(ecerGot[e.line]||0)+e.pcs; });
  var max={};
  var rows=pl.lines.filter(function(l){var k=lineKey(l), r=l.qty-(d.pcs[k]||0);
    if(keys){ max[k]=Math.max(r,0); return keys.indexOf(k)>=0; }
    if(r<=0||!l.pk) return false;
    if(r<l.pk){ max[k]=r; return true; }                       // karton penuh sudah selesai, sisa ecer
    var left=(l.qty%l.pk)-(ecerGot[k]||0);                      // item karton + ecer: bagian ecer yang belum diisi
    if(left>0){ max[k]=Math.min(r,left); return true; }
    return false;});
  if(!rows.length){toast('Tidak ada sisa ecer yang terbuka.');return;}
  APP.modal={type:'ecer',title:title,keys:rows.map(lineKey),vals:{},max:max};
  rows.forEach(function(l){APP.modal.vals[lineKey(l)]=0;});
  render();
  setTimeout(function(){var i=document.querySelector('.modal input');if(i){i.focus();i.select();}},30);
}

  rows.forEach(function(l){var k=lineKey(l), r=(max&&max[k]!=null)?max[k]:l.qty-(d.pcs[k]||0); if(!g[l.code])g[l.code]={pk:l.pk,sum:0,n:0,b:[]}; g[l.code].sum+=r; g[l.code].n++; g[l.code].b.push(l.batch+' '+r);});
  var out=[]; Object.keys(g).forEach(function(c){var x=g[c]; if(x.n>1&&x.pk&&x.sum%x.pk===0) out.push('Item '+c+': sisa '+x.b.join(' + ')+' = '+x.sum+' pcs, pas '+(x.sum/x.pk)+' karton. Kemungkinan dipacking jadi karton campuran: buka dan hitung per batch.');});
  return out;
}
function saveEcer(){
  var pl=plById(APP.pl), s=sess(pl.pl), d=lineDone(pl), m=APP.modal, bad=[];
  m.keys.forEach(function(k){var l=pl.lines.filter(function(x){return lineKey(x)===k;})[0]; var v=Math.round(Number(m.vals[k])||0); var r=l.qty-(d.pcs[k]||0); if(m.max&&m.max[k]!=null) r=Math.min(r,m.max[k]); if(v<0||v>r) bad.push('Item '+l.no+': maks '+r+' pcs');});
  if(bad.length){toast(bad.join(' · '));return;}

function camStart(){

  if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    msg('Pemindai kamera tidak didukung di browser ini. Pakai Chrome terbaru di Android.'); return;
  }
  var fmts=['qr_code','data_matrix','code_128','pdf417','aztec'];
  Promise.resolve(BarcodeDetector.getSupportedFormats?BarcodeDetector.getSupportedFormats():fmts).then(function(sup){
    var use=fmts.filter(function(f){return sup.indexOf(f)>=0;}); var det=new BarcodeDetector({formats:use.length?use:fmts});
    return navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}).then(function(st){
      var v=box.querySelector('video'); v.srcObject=st; v.setAttribute('playsinline',''); v.play();
      APP.cam={stream:st,det:det,busy:false,timer:setInterval(function(){
        if(APP.cam.busy||v.readyState<2) return; APP.cam.busy=true;
        det.detect(v).then(function(c){APP.cam.busy=false; if(c&&c.length) handleScan(c[0].rawValue,'camera');}).catch(function(){APP.cam.busy=false;});
      },250)};

var ST_CHIP={todo:['chip-w','Belum dicek'],busy:['chip-b','Sedang dicek'],diff:['chip-r','Ada selisih'],done:['chip-g','Selesai']};
/* Status SAP (kolom Status di PickingList_Data). Kode huruf dipetakan ke nama SAP B1 (perlu dicek ke SAP). */
var SAP_NAME={R:'Released',Y:'Picked',P:'Partially Picked',D:'Partially Delivered',C:'Closed'};
function sapLabel(v){return String(v||'').split(' / ').map(function(x){x=x.trim();return SAP_NAME[x.toUpperCase()]||x;}).filter(Boolean).join(' / ');}
function sapChip(p){var t=sapLabel(p&&p.sap); if(!t) return '';
  var k=t.toLowerCase(), c=k.indexOf('closed')>=0?'sap-c':k.indexOf('partial')>=0?'sap-p':k.indexOf('picked')>=0?'sap-y':'sap-r';
  return '<span class="chip sap '+c+'" title="Status picking list di SAP"><span class="sap-k">SAP</span>'+esc(t)+'</span>';}
function stChip(st){var c=ST_CHIP[st]||ST_CHIP.todo;return '<span class="chip '+c[0]+'">'+c[1]+'</span>';}
function avatar(id){return '<span class="avatar">'+esc(String(id||'?').slice(0,2).toUpperCase())+'</span>';}

function shell(top,content){
  return '<div class="shell">'+'<div class="main">'+top+'<div class="page">'+content+'</div></div></div>';
}
function topbar(left){
  var u=APP.me||{};
  return '<header class="topbar"><button type="button" class="tb-brand" id="navPL" aria-label="Ke daftar Picking List"><span class="logo sm">'+ICON.idle.replace('#5A6B85','#fff')+'</span>'+
      '<span class="tb-name"><b>Picking Checker</b><small>PT Eka Jaya Internasional</small></span></button>'+
    '<div class="tb-left">'+left+'</div><span id="syncState" class="sync"></span>'+
    '<div class="tb-user">'+avatar(u.id)+'<span class="tb-who"><b class="ell">'+esc(u.name||u.id||'')+'</b><small>'+esc(u.id||'')+(u.role==='admin'?' · admin':'')+'</small></span>'+
      '<button type="button" class="btn tb-out" id="bOutM" aria-label="Keluar">'+IC2.out+'<span class="tb-outl">Keluar</span></button></div></header>';
}
function steps(st){
  var idx=st==='todo'?0:st==='busy'?1:2, names=['Belum dicek','Sedang dicek',st==='diff'?'Ada selisih':'Selesai'];
  var h='<div class="steps">';
  names.forEach(function(n,i){h+='<div class="st'+(i<idx?' done':i===idx?' cur':'')+(i===2&&st==='diff'?' bad':'')+'"><i></i><span>'+n+'</span></div>';});
  return h+'</div>';
}

function vList(){
  var sapCnt={}, sapOrder=[];
  APP.pls.forEach(function(p){var t=sapLabel(p.sap)||'Tanpa status'; if(!sapCnt[t]){sapCnt[t]=0;sapOrder.push(t);} sapCnt[t]++;});
  if(APP.sapF!=='all'&&!sapCnt[APP.sapF]) APP.sapF='all';
  var base=APP.pls.filter(function(p){return APP.sapF==='all'||(sapLabel(p.sap)||'Tanpa status')===APP.sapF;});
  var counts={todo:0,busy:0,diff:0,done:0};
  base.forEach(function(p){counts[plStatus(p)]++;});
  var q=APP.q.trim().toLowerCase();
  var rows=base.filter(function(p){
    var st=plStatus(p); if(APP.filter!=='all'&&st!==APP.filter) return false;
    if(!q) return true; return (p.pl+' '+(p.ors||[]).join(' ')+' '+p.cust+' '+p.rem+' '+sapLabel(p.sap)).toLowerCase().indexOf(q)>=0;
  });
  var top=topbar('<div class="tsearch has-search">'+ICON.search+'<label class="sr" for="q">Cari picking list</label><input id="q" value="'+esc(APP.q)+'" placeholder="Scan / ketik No. PL, OR, atau customer lalu Enter"></div>');
  var h='<div class="crumb">Operasional <span>/</span> <b>Picking List</b></div>';
  h+='<div class="doc-head"><div><h1>Picking List</h1><div class="muted">'+APP.pls.length+' picking list aktif · Gudang '+esc((APP.pls[0]&&APP.pls[0].wh)||'-')+' · sinkron dari SAP</div></div>'+
    '<div class="doc-act"><button type="button" class="btn" id="bExport">'+IC2.xls+'Export Excel</button></div></div>';
  if(APP.plsErr) h+='<div class="note" style="background:var(--err-soft);color:var(--err);margin-bottom:12px">'+esc(APP.plsErr)+'</div>';
  var names={todo:'Belum dicek',busy:'Sedang dicek',diff:'Ada selisih',done:'Selesai',all:'Semua'};
  h+='<nav class="tabs" aria-label="Filter status">';
  ['all','todo','busy','diff','done'].forEach(function(k){h+='<button type="button" class="tab" data-f="'+k+'" aria-pressed="'+(APP.filter===k)+'">'+names[k]+'<span class="cnt">'+(k==='all'?base.length:counts[k])+'</span></button>';});
  h+='</nav>';
  if(sapOrder.length){
    var SAP_RANK=['Released','Picked','Partially Picked','Partially Delivered','Closed'];
    sapOrder.sort(function(a,b){var x=SAP_RANK.indexOf(a),y=SAP_RANK.indexOf(b); return (x<0?99:x)-(y<0?99:y)||(a<b?-1:1);});
    h+='<div class="sapf" role="group" aria-label="Filter status SAP"><span class="sapf-l">Status SAP</span>'+
      '<button type="button" class="pal sm" data-sapf="all" aria-pressed="'+(APP.sapF==='all')+'">Semua<span class="cnt">'+APP.pls.length+'</span></button>'+
      sapOrder.map(function(t){return '<button type="button" class="pal sm" data-sapf="'+esc(t)+'" aria-pressed="'+(APP.sapF===t)+'">'+esc(t)+'<span class="cnt">'+sapCnt[t]+'</span></button>';}).join('')+'</div>';
  }
  h+='<div class="cards">';
  if(!rows.length) h+='<div class="card muted" style="padding:24px 18px">'+(APP.pls.length?'Tidak ada picking list di filter ini.':'Belum ada picking list. Data dikirim dari Sheet oleh GAS.')+'</div>';
  rows.forEach(function(p){
    var ag=itemAgg(p.lines||[]), full=ag.ctnTgt, loose=0; (p.lines||[]).forEach(function(l){ if(l.pk&&l.qty%l.pk) loose++; });
    var status=plStatus(p), mine=p.lock&&APP.me&&p.lock.uid===APP.me.uid;
    var who=status==='busy'?(lockActive(p)?('Dicek '+(mine?'Anda':(p.lock.id||''))):'Kunci lepas'):(lockActive(p)&&(status==='todo')?('Dibuka '+(mine?'Anda':(p.lock.id||''))):'');
    h+='<div class="plwrap"><button type="button" class="plcard" data-pl="'+esc(p.pl)+'">'+
      '<div class="c-pl"><div class="pl-top">'+stChip(status)+'<span class="plno">PL '+esc(p.pl)+'</span>'+sapChip(p)+'</div>'+
        '<div class="meta"><span>'+IC2.cal+esc(p.date||'-')+'</span><span>'+IC2.user+'Picker '+esc(p.picker||'-')+'</span>'+(who?'<span class="who-l">'+esc(who)+'</span>':'')+'</div></div>'+
      '<div class="c-cust col"><span class="lab">Customer</span><span class="val ell">'+esc(p.cust)+'</span><span class="sub ell">OR '+esc((p.ors||[]).join(' · '))+'</span></div>'+
      '<div class="c-lines col r"><span class="lab">Item</span><span class="val">'+ag.items+'</span></div>'+
      '<div class="c-full col r"><span class="lab">Karton</span><span class="val">'+nf(full)+'</span></div>'+
      '<div class="c-loose col r"><span class="lab">Ecer</span><span class="val">'+(loose?loose+' item':'-')+'</span></div>'+
      '<span class="c-go">'+IC2.chev+'</span>'+
    '</button>'+
    (APP.me&&APP.me.role==='admin'&&p.lock&&!mine?'<button type="button" class="btn unlock" data-unlock="'+esc(p.pl)+'">Lepas kunci</button>':'')+
    '</div>';
  });
  h+='</div>';
  return shell(top,h);
}

function vScan(){
  var pl=plById(APP.pl), s=sess(pl.pl), st=plStats(pl), d=lineDone(pl);
  var pct=st.tgtPcs?Math.round(st.pcs/st.tgtPcs*100):0;
  var top=topbar('<div class="crumb tb"><button type="button" class="link" id="bBack">Picking List</button><span>/</span><b>PL '+esc(pl.pl)+'</b></div>');
  var h='<div class="doc-head"><div style="min-width:0"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h1>PL '+esc(pl.pl)+'</h1>'+stChip('busy')+sapChip(pl)+'</div>'+
    '<div class="muted ell">Tanggal pick '+esc(pl.date||'-')+' · '+esc(pl.cust)+'</div></div>'+
    '<div class="doc-act"><div class="seg" role="group" aria-label="Satuan hitung"><button type="button" data-mode="ctn" aria-pressed="'+(APP.mode==='ctn')+'">Karton</button><button type="button" data-mode="pcs" aria-pressed="'+(APP.mode==='pcs')+'">Ecer (pcs)</button></div>'+
    '<div class="seg" role="group" aria-label="Perangkat input"><button type="button" data-in="scanner" aria-pressed="'+(APP.input==='scanner')+'">Scanner</button><button type="button" data-in="camera" aria-pressed="'+(APP.input==='camera')+'">Kamera HP</button></div>'+
    '<button type="button" class="btn pri" id="bSum">Selesai &amp; ringkasan</button></div></div>';
  if(APP.plChanged) h+='<div class="note" style="margin-bottom:12px;background:var(--err-soft);color:var(--err)">Picking list ini berubah di SAP/Sheet setelah dibuka. Kembali ke daftar dan buka lagi sebelum lanjut scan.</div>';
  h+='<div class="dgrid">';
  // scan
  h+='<section class="d-scan" aria-label="Panel scan"><div class="scanrow">';
  if(APP.input==='camera'){
    h+='<div class="camwrap" id="camBox"><video muted playsinline></video><div class="frame"></div><div class="msg">Membuka kamera…</div></div>';
  } else {
    h+='<div class="card scanbox"><div style="display:flex;justify-content:space-between;align-items:center"><label for="scan" style="font-size:13px;font-weight:500">Scan barcode '+(APP.mode==='ctn'?'karton':'(ecer)')+'</label><span class="ready" id="ready"><i></i><span>Siap scan</span></span></div>'+
      '<input id="scan" class="scaninp" autocomplete="off" autocorrect="off" spellcheck="false" '+(APP.typing?'':'inputmode="none"')+' placeholder="Arahkan scanner ke label karton"'+(APP.blocked?' disabled':'')+'>'+
      '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="muted" style="font-size:12px">'+(APP.mode==='ctn'?'1 scan = 1 karton (isi sesuai label).':'Scan item, lalu isi jumlah pcs.')+'</span>'+
      '<button type="button" class="btn" id="bType" style="height:36px;padding:0 10px;font-size:12px">'+(APP.typing?'Sembunyikan keyboard':'Ketik manual')+'</button></div></div>';
  }
  h+=vFb()+'</div>';
  if(APP.mode==='ctn'&&st.looseLines>pl.lines.length*CFG.ecerSuggestRatio&&!okEvents(s).length) h+='<div class="note" style="margin-top:12px">'+st.looseLines+' dari '+pl.lines.length+' item berupa ecer. Pakai mode "Ecer (pcs)".</div>';
  h+='</section>';

  // aside
  var u=APP.me||{};
  h+='<aside class="d-aside">'+
    '<div class="card pad mhide">'+steps(plStatus(pl)==='done'||plStatus(pl)==='diff'?plStatus(pl):'busy')+'</div>'+
    '<div class="card pad"><div class="ctitle">Progress</div>'+
      '<div class="kpis">'+kpiBtn('log','Karton',nf(st.ctn)+'<small> / '+nf(st.fullTgt)+'</small>','Lihat log karton yang sudah discan')+
      kpiBtn('done','Item',st.doneLines+'<small> / '+st.lines+'</small>','Lihat item yang sudah lengkap')+
      kpiBtn('rej','Ditolak','<span style="color:'+(st.rejected?'var(--err)':'inherit')+'">'+st.rejected+'</span>','Lihat scan yang ditolak')+'</div>'+ctnNote(st)+
      '<div style="display:flex;justify-content:space-between;font-size:12px;margin:10px 0 6px"><span class="muted">'+nf(st.pcs)+' / '+nf(st.tgtPcs)+' pcs</span><span>'+pct+'%</span></div><div class="bar"><div style="width:'+pct+'%"></div></div>'+
      palRow(s)+
      '<div class="btn2"><button type="button" class="btn" id="bUndo">Batalkan scan</button><button type="button" class="btn" id="bEcer">Input ecer</button></div>'+
      '<button type="button" class="btn pri block monly" id="bSum2" style="margin-top:10px;height:52px">Selesai &amp; ringkasan</button></div>'+
    '<div class="card pad mhide"><div class="ctitle">Checker</div><div class="who">'+avatar(u.id)+'<div><div style="font-weight:500">'+esc(u.name||u.id||'')+'</div><div class="muted" style="font-size:12px">'+esc(u.id||'')+'</div></div></div></div>'+
    '<div class="card pad mhide"><div class="ctitle">Informasi Picking</div>'+kv('Status SAP',sapLabel(pl.sap)||'-')+kv('Tanggal pick',pl.date||'-')+kv('Picker',pl.picker||'-')+kv('Gudang',pl.wh||'-')+kv('OR',(pl.ors||[]).join(', '))+kv('Item',String(itemAgg(pl.lines).items)+(itemAgg(pl.lines).items!==pl.lines.length?' ('+pl.lines.length+' baris batch)':''))+'</div>'+
    '<div class="card pad mhide"><div class="ctitle">Customer</div><div style="font-weight:500;margin-bottom:4px">'+esc(pl.cust)+'</div><div class="muted" style="font-size:12px">'+esc(pl.rem)+'</div></div>'+
  '</aside>';

  // items
  var errBy=lineErrors(pl,s);
  var rows=pl.lines.map(function(l){var k=lineKey(l),got=d.pcs[k]||0,rem=l.qty-got;
    var stt=got>=l.qty?'done':(l.pk&&rem<l.pk&&got>0)?'ecer':got>0?'part':'todo';
    var err=errBy[k]||0;
    var grp=stt==='done'?'done':err?'err':got>0?'prog':'todo';
    if(k===APP.lastLine) grp='cur';
    return {l:l,k:k,got:got,stt:stt,err:err,grp:grp};});
  var extra=strayRejects(s);
  var cnt={all:rows.length+extra.length,prog:0,err:extra.length,todo:0,done:0,log:okEvents(s).length,rej:st.rejected,pal:s.palCount||1};
  rows.forEach(function(r){
    if(r.stt==='done') cnt.done++; else if(r.err) cnt.err++; else if(r.got>0) cnt.prog++; else cnt.todo++;
    if(r.grp==='cur'&&!(r.stt!=='done'&&!r.err&&r.got>0)) cnt.prog++;
  });
  var f=APP.itemFilter;
  var GRP={cur:0,prog:1,err:2,todo:3,done:4};
  var GNAME={cur:'Sedang dicek',prog:'Sedang dicek',err:'Ada scan salah',todo:'Belum dicek',done:'Selesai & sesuai'};
  var dg=function(r){return r.grp==='cur'?'prog':r.grp;};
  var shown=rows.filter(function(r){
    if(f==='all') return true;
    if(f==='prog') return r.grp==='cur'||(r.stt!=='done'&&!r.err&&r.got>0);
    if(f==='err') return r.stt!=='done'&&r.err>0;
    if(f==='todo') return r.stt!=='done'&&!r.err&&!r.got;
    if(f==='done') return r.stt==='done';
    return false;
  });
  if(APP.iq){ shown=shown.filter(function(r){return iqMatch([r.l.desc,r.l.code,r.l.batch,r.l.or,'#'+r.l.no]);});
    extra=extra.filter(function(x){return iqMatch([x.title,x.code,x.batch,x.raw]);}); }
  shown.sort(function(a,b){return (GRP[a.grp]-GRP[b.grp])||(a.l.no-b.l.no);});
  h+='<section class="card items d-items" id="itemsSec" aria-label="Daftar item"><nav class="tabs in" aria-label="Filter item">'+
    [['all','Semua'],['prog','Sedang dicek'],['err','Salah'],['todo','Belum'],['done','Lengkap'],['pal','Palet'],['log','Log'],['rej','Ditolak']].map(function(x){return '<button type="button" class="tab'+(x[0]==='err'&&cnt.err?' t-err':'')+'" data-if="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+'<span class="cnt">'+cnt[x[0]]+'</span></button>';}).join('')+
    '</nav>'+
    '<div class="iqrow"><span class="iqico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>'+
    '<label class="sr" for="iq">Cari item di PL ini</label><input id="iq" class="inp iq" type="search" autocomplete="off" spellcheck="false" placeholder="Cari nama item, kode, atau batch" value="'+esc(APP.iq)+'">'+
    '<button type="button" class="btn iqx" id="bIqX" aria-label="Hapus pencarian"'+(APP.iq?'':' hidden')+'>×</button></div><div id="itemsBody">'+
    (APP.iq?'<div class="iqinfo">Hasil cari “'+esc(APP.iq)+'”'+(f==='log'||f==='rej'||f==='pal'?'':': '+(shown.length+((f==='all'||f==='err')?extra.length:0))+' item')+' · tekan Enter atau × untuk kembali scan</div>':'');
  if(f==='log'||f==='rej'){
    h+=scanLog(pl,s,f);
  } else if(f==='pal'){
    h+=paletView(pl,s);
  } else {
    h+='<div class="it t8 head"><span class="c-no">No</span><span>Item</span><span class="c-batch">Batch</span><span class="r c-tgt">Ctn + Pcs</span><span class="r c-tp">Total pcs</span><span class="r c-td">Ctn</span><span class="r c-done">Dicek</span><span class="c-st">Status</span></div>';
    var tags={done:['chip-g','Lengkap'],ecer:['chip-w','Perlu ecer'],part:['chip-b','Sebagian'],todo:['chip-n','Belum']};
    var lastG=null, gc={prog:0,err:0,todo:0,done:0};
    shown.forEach(function(r){gc[dg(r)]++;});
    if(f==='all'||f==='err') gc.err+=extra.length;
    var extraDone=!(f==='all'||f==='err');
    function putExtra(){ if(extraDone) return; extraDone=true; if(!extra.length) return;
      if(f==='all'&&lastG!=='err'){ h+='<div class="it-grp g-err">'+GNAME.err+'<span>'+gc.err+'</span></div>'; lastG='err'; }
      extra.forEach(function(x){
        h+='<div class="it t8 bad"><span class="c-no muted">-</span><div style="min-width:0"><div class="d1 ell">'+esc(x.title)+'</div><div class="d2">'+esc(x.code||x.raw)+'</div>'+
          '<div class="d3">'+x.n+' scan · '+esc(x.hint)+'</div></div><span class="c-batch mono" style="font-size:13px">'+esc(x.batch||'-')+'</span><span class="r c-tgt" style="font-size:13px">-</span><span class="r c-tp">-</span><span class="r c-td">-</span>'+
          '<span class="r c-done" style="font-size:13px;font-weight:500">'+x.n+' scan</span><span class="c-st"><span class="chip chip-r">'+esc(x.chip)+'</span>'+cBtn('S:'+x.key,'Hapus','hapus scan ditolak '+x.title)+'</span></div>';
      });
    }
    shown.forEach(function(r){var l=r.l;
      var g=f==='all'?dg(r):null;
      if(f==='err'||(f==='all'&&GRP[dg(r)]>GRP.err)) putExtra();
      if(f==='all'&&g!==lastG){ h+='<div class="it-grp g-'+g+'">'+GNAME[g]+'<span>'+gc[g]+'</span></div>'; lastG=g; }

var REASONS=['Kurang pick - kembalikan ke picker','Stok fisik tidak ada','Karton rusak','Lainnya'];
var REJ_NAME={NOTIN:'Item tidak ada di PL',BATCH:'Batch tidak sesuai',OVER:'Melebihi target',REMAIN:'Sisa ecer (karton penuh ditolak)',FORMAT:'Barcode tidak dikenali'};
function rejectedOf(s){var u=undoneSet(s);return s.events.filter(function(e){return REJ_NAME[e.res]&&!u[e.id];});}
/** Jumlah scan salah per item: batch salah & melebihi target. (Sisa ecer bukan salah.) */
function lineErrors(pl,s){
  var out={};
  rejectedOf(s).forEach(function(e){
    if(e.res!=='BATCH'&&e.res!=='OVER') return;
    var k=e.line;
    if(!k&&e.code){ var l=pl.lines.filter(function(x){return x.code===e.code;})[0]; if(l) k=lineKey(l); }
    if(k) out[k]=(out[k]||0)+1;
  });
  return out;
}
/** Cocokkan kata kunci pencarian (semua kata harus ada) ke deskripsi/kode/batch/OR/No. */
function iqMatch(parts){
  var q=String(APP.iq||'').trim().toLowerCase(); if(!q) return true;
  var hay=parts.map(function(x){return String(x==null?'':x);}).join(' ').toLowerCase();
  return q.split(/\s+/).every(function(w){return hay.indexOf(w)>=0;});
}
/** Scan ditolak yang kartonnya harus dipisahkan secara fisik (sisa ecer tidak termasuk). */
function sepRejects(s){return rejectedOf(s).filter(function(e){return ['BATCH','OVER','NOTIN','FORMAT'].indexOf(e.res)>=0;});}
/** Scan ditolak yang tidak menempel ke item PL: item tidak ada di PL & barcode tidak dikenali. */
function strayKey(e){return e.res+'|'+(e.res==='NOTIN'?(e.code+'|'+e.batch):(e.raw||''));}
function strayRejects(s){
  var m={}, out=[];
  rejectedOf(s).forEach(function(e){
    if(e.res!=='NOTIN'&&e.res!=='FORMAT') return;
    var key=strayKey(e);
    if(!m[key]){ m[key]={key:key,n:0,code:e.code||'',batch:e.batch||'',raw:(e.raw||'').slice(0,60),
      title:e.res==='NOTIN'?'Item tidak ada di PL ini':'Barcode tidak dikenali',
      chip:e.res==='NOTIN'?'Tidak di PL':'Barcode rusak',
      hint:e.res==='NOTIN'?'pisahkan, kembalikan ke picker':'cek label karton'}; out.push(m[key]); }
    m[key].n++;
  });
  return out;
}
/** Isi karton dari barcode (field ke-4) untuk scan yang ditolak. */
function rejPer(e){ var b=parseBarcode(e.raw||''); return (b&&b.ok&&b.per)||0; }
/** Per palet: c = karton diterima, r = karton ditolak (tetap ada fisik di palet), p = pcs diterima, rp = pcs ditolak. */
function palStats(s){
  var p={}; function g(n){return p[n]=p[n]||{c:0,p:0,r:0,rp:0};}
  okEvents(s).forEach(function(e){var x=g(e.palet||1); if(e.kind==='ctn')x.c++; x.p+=e.pcs;});
  rejectedOf(s).forEach(function(e){ if(e.res==='REMAIN') return; var x=g(e.palet||1); x.r++; x.rp+=rejPer(e); });
  return p;
}
function palRow(s){
  var n=Math.max(s.palCount||1,s.palet), ps=palStats(s), h='<div class="palrow2"><div class="ctitle" style="margin:0">Palet aktif</div><div class="pals" role="group" aria-label="Pilih palet aktif">';
  for(var i=1;i<=n;i++){ var x=ps[i]||{c:0,p:0,r:0};
    h+='<button type="button" class="pal" data-pal="'+i+'" aria-pressed="'+(s.palet===i)+'" title="'+nf(x.c)+' diterima'+(x.r?' + '+nf(x.r)+' ditolak':'')+'"><b>'+i+'</b><small>'+nf(x.c+x.r)+' ctn</small>'+(x.r?'<small class="palr">'+nf(x.r)+' ditolak</small>':'')+'</button>'; }
  h+='<button type="button" class="pal add" id="bPalet" aria-label="Tambah palet baru">+<small>Baru</small></button></div></div>';
  return h;
}
/** Isi per palet: item PL yang discan ke palet tsb. */
function paletView(pl,s){
  var n=Math.max(s.palCount||1,s.palet), byK={}, agg={}, h='';
  pl.lines.forEach(function(l){byK[lineKey(l)]=l;});
  okEvents(s).forEach(function(e){var p=e.palet||1; agg[p]=agg[p]||{}; var a=agg[p][e.line]=agg[p][e.line]||{c:0,p:0}; if(e.kind==='ctn')a.c++; a.p+=e.pcs;});
  var v=APP.palView;
  h+='<div class="pvbar" role="group" aria-label="Tampilkan palet"><button type="button" class="pal sm" data-pv="all" aria-pressed="'+(v==='all')+'">Semua</button>';
  for(var i=1;i<=n;i++) h+='<button type="button" class="pal sm" data-pv="'+i+'" aria-pressed="'+(v===i)+'">Palet '+i+'</button>';
  h+='</div>';
  for(var j=1;j<=n;j++){
    if(v!=='all'&&v!==j) continue;
    var rows=agg[j]||{}, keys=Object.keys(rows).filter(function(k){var l=byK[k]; return !l||iqMatch([l.desc,l.code,l.batch,l.or,'#'+l.no]);}).sort(function(a,b){return (byK[a]?byK[a].no:0)-(byK[b]?byK[b].no:0);});
    var tc=0,tp=0; keys.forEach(function(k){tc+=rows[k].c;tp+=rows[k].p;});
    var rg=rejGroups(pl,s,function(e){return (e.palet||1)===j&&e.res!=='REMAIN';});
    var rc=0,rpc=0; rg.forEach(function(g){rc+=g.n;rpc+=g.pcs;});
    h+='<div class="it-grp g-prog">Palet '+j+(s.palet===j?' · aktif':'')+'<span>'+nf(tc+rc)+' ctn'+(rc?' ('+nf(rc)+' ditolak)':'')+' · '+nf(tp+rpc)+' pcs · '+keys.length+' item</span></div>';
    if(!keys.length&&!rg.length){ h+='<div style="padding:12px 14px" class="muted">Belum ada scan di palet ini.</div>'; continue; }
    keys.forEach(function(k){var l=byK[k]||{no:'-',desc:k,code:'',batch:'',pk:0};
      h+='<div class="it"><span class="c-no muted">'+l.no+'</span><div style="min-width:0"><div class="d1 ell">'+esc(l.desc)+'</div><div class="d2"><span class="mno">No '+esc(l.no)+' · </span>'+esc(l.code)+'</div></div>'+
        '<span class="c-batch mono" style="font-size:13px">'+esc(l.batch)+'</span><span class="r c-tgt" style="font-size:13px">'+nf(rows[k].c)+' ctn</span>'+
        '<span class="r c-done" style="font-size:13px;font-weight:500">'+nf(rows[k].p)+' pcs</span><span class="c-st"></span></div>';

    var lines=r.lines||[], tgt=0, got=0, diff=0, ctn=0, tgtCtn=0, hasTgtCtn=(r.tgtCtn!==undefined&&r.tgtCtn!==null);

      tgt+=q; got+=Math.min(p,q); if(p!==q) diff++; ctn+=Number(l.ctn)||0; if(!hasTgtCtn&&pk) tgtCtn+=Math.floor(q/pk);
      det.push([r.pl,l.or||'',l.no,l.code,l.desc||(byNo[l.no]&&byNo[l.no].desc)||'',l.batch,q,p,Number(l.ctn)||0,p-q,p===q?'Sesuai':(p<q?'Kurang':'Lebih'),l.reason||'',ST_NAME[r.status]||r.status||'']); });
    var agx=itemAgg(lines.map(function(l){return {code:l.code,qty:Number(l.qty)||0,pk:Number(l.pk)||(byNo[l.no]&&byNo[l.no].pk)||0};}));
    if(!hasTgtCtn) tgtCtn=agx.ctnTgt;
    var tc=hasTgtCtn?Number(r.tgtCtn):(tgtCtn||''), cd=(r.ctnTotal!==undefined&&r.ctnTotal!==null)?Number(r.ctnTotal):ctn;
    var dur=(r.startedAt&&r.finishedAt)?Math.round((r.finishedAt-r.startedAt)/60000):'';
    sum.push([r.pl,(r.ors||[]).join(', '),r.cust||(live&&live.cust)||'',sapLabel(r.sap||(live&&live.sap)),ST_NAME[r.status]||r.status||'',r.startedAt||'',r.finishedAt||'',dur,r.checkerId||'',(r.scanners||[]).join(', '),
      agx.items,diff,tgt,got,got-tgt,tc,cd,ctnKet(tc,cd),(r.rejectedCount!=null?r.rejectedCount:(r.rejected||[]).length),r.rejSeparated===true?'Ya':r.rejSeparated===false?'Belum':'']);
    (r.rejected||[]).forEach(function(x){ rej.push([r.pl,x.t||'',x.code||'',x.batch||'',REJ_NAME[x.res]||x.res||'',x.raw||'',x.by||r.checkerId||'']); });
  });
  return XL.build([
    {name:'Ringkasan',cols:[{h:'PickListNo',w:11},{h:'OR',w:24},{h:'Customer',w:32},{h:'Status SAP',w:13},{h:'Hasil cek',w:12},{h:'Mulai',w:16,t:'d'},{h:'Selesai',w:16,t:'d'},{h:'Durasi (menit)',w:9,t:'n'},
      {h:'Disubmit oleh',w:12},{h:'Semua checker',w:16},{h:'Item',w:7,t:'n'},{h:'Item selisih',w:9,t:'n'},{h:'Target pcs',w:10,t:'n'},{h:'Dicek pcs',w:10,t:'n'},{h:'Selisih pcs',w:10,t:'n'},
      {h:'Target ctn',w:9,t:'n'},{h:'Dicek ctn',w:9,t:'n'},{h:'Keterangan karton',w:18},{h:'Scan ditolak',w:9,t:'n'},{h:'Karton ditolak dipisahkan',w:12}],rows:sum},
    {name:'Detail item',cols:[{h:'PickListNo',w:11},{h:'OR',w:12},{h:'No',w:5,t:'n'},{h:'ItemCode',w:12},{h:'Deskripsi',w:44},{h:'Batch',w:11},{h:'Target pcs',w:10,t:'n'},{h:'Dicek pcs',w:10,t:'n'},
      {h:'Dicek ctn',w:9,t:'n'},{h:'Selisih pcs',w:10,t:'n'},{h:'Keterangan',w:10},{h:'Alasan',w:30},{h:'Hasil cek PL',w:12}],rows:det},
    {name:'Scan ditolak',cols:[{h:'PickListNo',w:11},{h:'Waktu',w:16,t:'d'},{h:'ItemCode',w:12},{h:'Batch',w:11},{h:'Hasil',w:26},{h:'Isi barcode',w:60},{h:'Checker',w:10}],rows:rej}
  ]);
}
function downloadBlob(blob,name){
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},1000);
}
function stamp(){var d=new Date();function p(n){return ('0'+n).slice(-2);} return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());}
async function exportResults(ids,label){
  if(APP.busy) return; APP.busy=true; toast('Menyiapkan Excel…');
  try{
    var list=await DB.getResults(ids);
    if(!list.length){ toast(ids?'PL yang dipilih belum punya hasil submit.':'Belum ada hasil pengecekan.'); return; }
    downloadBlob(resultsWorkbook(list),'Hasil Cek '+label+' '+stamp()+'.xlsx');
    toast('Excel diunduh: '+list.length+' PL.'+(ids&&list.length<ids.length?' '+(ids.length-list.length)+' PL belum disubmit, tidak ikut.':''));
    APP.modal=null; render();
  }catch(e){ toast('Export gagal: '+(e.code||e.message)); }
  finally{ APP.busy=false; }
}
/** Export PL yang sedang dibuka dari data di perangkat (bisa sebelum submit). */
function exportCurrent(){
  var pl=plById(APP.pl); if(!pl) return;
  var r=buildResult(pl); var s=sess(pl.pl);
  if(!s.submitted) r.status=r.status==='diff'?'Belum submit - ada selisih':'Belum submit - sesuai';
  if(!r.finishedAt) r.finishedAt=null;
  downloadBlob(resultsWorkbook([r]),'Hasil Cek PL '+pl.pl+' '+stamp()+'.xlsx');
  toast('Excel PL '+pl.pl+' diunduh.');
}
function openExport(){
  var sel={}; APP.pls.forEach(function(p){ var st=plStatus(p); if(st==='done'||st==='diff') sel[p.pl]=false; });
  APP.modal={type:'export',mode:'pick',sel:sel,q:''}; render();
}

/* ================= Event binding ================= */
function on(id,ev,fn){var el=document.getElementById(id); if(el) el.addEventListener(ev,fn);}
function focusScan(){ if(APP.view!=='scan'||APP.modal||APP.input!=='scanner'||APP.iqFocus) return; var i=$('#scan'); if(i&&!i.disabled){ i.focus(); } }
function each(sel,fn){Array.prototype.forEach.call(document.querySelectorAll(sel),fn);}
function doLogout(){ if(APP.pl){ flush(); camStop(); stopHeartbeat(); if(APP.unsubPl){APP.unsubPl();APP.unsubPl=null;} APP.pl=null; } DB.logout(); }
function bind(){
  if(APP.view!=='login'){
    on('bOutM','click',doLogout);
    on('navPL','click',function(){ if(APP.view!=='list') leavePl(); });
  }
  if(APP.view==='login'){
    on('fLogin','submit',function(e){e.preventDefault(); audioInit();
      var id=$('#uid').value.trim().toUpperCase(), pin=$('#pin').value.trim();
      if(!id||!/^\d{6}$/.test(pin)){APP.authMsg='ID wajib diisi, PIN 6 angka.';render();return;}
      APP.busy=true; APP.authMsg=''; render();
      DB.login(id,pin).then(function(){APP.busy=false;},function(err){
        APP.busy=false;
        var c=err&&err.code||'';
        APP.authMsg=(c.indexOf('invalid')>=0||c.indexOf('wrong-password')>=0||c.indexOf('user-not-found')>=0)?'ID atau PIN salah.':
          c.indexOf('too-many-requests')>=0?'Terlalu banyak percobaan. Tunggu beberapa menit.':
          c.indexOf('user-disabled')>=0?'Akun nonaktif. Hubungi admin.':
          c.indexOf('network')>=0?'Tidak ada koneksi internet.':('Gagal masuk: '+(c||err));
        render();
      });
    });
    setTimeout(function(){var u=$('#uid'); if(u&&!u.value)u.focus();},30);
    return;
  }
  if(APP.view==='list'){
    on('bExport','click',openExport);
    if(APP.modal&&APP.modal.type==='export') bindModal();
    var q=$('#q'); if(q){ q.addEventListener('input',function(){APP.q=q.value; var pos=q.selectionStart; render(); var q2=$('#q'); q2.focus(); try{q2.setSelectionRange(pos,pos);}catch(e){}});
      q.addEventListener('keydown',function(e){ if(e.key==='Enter'){ var v=q.value.trim(); var p=plById(v)||APP.pls.filter(function(x){return (x.ors||[]).indexOf(v)>=0;})[0]; if(p) openPl(p.pl); else toast('PL '+v+' tidak ditemukan.'); }}); }
    each('[data-f]',function(b){b.addEventListener('click',function(){APP.filter=b.getAttribute('data-f');render();});});
    each('[data-sapf]',function(b){b.addEventListener('click',function(){APP.sapF=b.getAttribute('data-sapf');render();});});
    each('[data-pl]',function(b){b.addEventListener('click',function(){openPl(b.getAttribute('data-pl'));});});
    each('[data-unlock]',function(b){b.addEventListener('click',function(ev){ev.stopPropagation(); var id=b.getAttribute('data-unlock');
      DB.forceUnlock(id).then(function(){toast('Kunci PL '+id+' dilepas.');},function(e){toast('Gagal: '+(e.code||e.message));});});});
    return;
  }
  if(APP.view==='scan'){
    audioInit();
    on('bBack','click',leavePl);
    var sc=$('#scan');
    if(sc){
      sc.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key==='Tab'){ e.preventDefault(); var v=sc.value; sc.value=''; handleScan(v,'scanner'); focusScan(); }});
      sc.addEventListener('blur',function(){ setTimeout(function(){ var a=document.activeElement; if(APP.view==='scan'&&!APP.modal&&(!a||a===document.body)) focusScan(); },150); });
      var r=$('#ready'); sc.addEventListener('focus',function(){if(r){r.classList.remove('off');r.lastChild.textContent='Siap scan';}}); sc.addEventListener('blur',function(){if(r){r.classList.add('off');r.lastChild.textContent='Klik kolom scan';}});
    }
    on('bAck','click',ack);
    if(APP.fb&&APP.fb.actions) APP.fb.actions.forEach(function(x,i){var b=document.querySelector('[data-act="'+i+'"]'); if(b) b.addEventListener('click',x.fn);});
    on('bUndo','click',undo);
    on('bEcer','click',function(){openEcer(null,'Sisa ecer / karton campuran');});
    var goSum=function(){camStop();flush();APP.view='sum';render();window.scrollTo(0,0);};
    on('bSum','click',goSum); on('bSum2','click',goSum);
    on('bType','click',function(){APP.typing=!APP.typing;render();focusScan();});
    on('bPalet','click',function(){var s=sess(APP.pl); s.palCount=Math.max(s.palCount||1,s.palet)+1; s.palet=s.palCount; toast('Palet '+s.palet+' dibuat dan aktif. Scan berikutnya masuk palet ini.'); render(); focusScan();});
    each('[data-pal]',function(b){b.addEventListener('click',function(){var s=sess(APP.pl), n=Number(b.getAttribute('data-pal')); if(s.palet!==n){ s.palet=n; toast('Palet '+n+' aktif. Scan berikutnya masuk palet ini.'); } render(); focusScan();});});
    each('[data-pv]',function(b){b.addEventListener('click',function(){var v=b.getAttribute('data-pv'); APP.palView=v==='all'?'all':Number(v); render(); focusScan();});});
    each('[data-mode]',function(b){b.addEventListener('click',function(){APP.mode=b.getAttribute('data-mode');render();focusScan();});});
    each('[data-in]',function(b){b.addEventListener('click',function(){var v=b.getAttribute('data-in'); if(v!==APP.input){camStop();APP.input=v;render(); if(v==='camera')camStart(); else focusScan();}});});
    each('[data-if]',function(b){b.addEventListener('click',function(){APP.itemFilter=b.getAttribute('data-if');render();focusScan();});});
    var iq=$('#iq');
    if(iq){
      iq.addEventListener('focus',function(){APP.iqFocus=true;});
      iq.addEventListener('blur',function(){ setTimeout(function(){ if(document.activeElement!==$('#iq')){ APP.iqFocus=false; var a=document.activeElement; if(!a||a===document.body) focusScan(); } },0); });
      iq.addEventListener('input',function(){ APP.iq=iq.value; renderItemsOnly(); });
      iq.addEventListener('keydown',function(e){
        if(e.key==='Escape'){ e.preventDefault(); APP.iq=''; APP.iqFocus=false; render(); focusScan(); return; }
        if(e.key==='Enter'){ e.preventDefault(); var v=iq.value.trim();
          // Scanner sempat menembak ke kotak cari: proses sebagai scan, jangan jadi kata kunci.
          if(v.indexOf(';')>=0){ APP.iq=''; APP.iqFocus=false; handleScan(v,'scanner'); focusScan(); return; }
          APP.iqFocus=false; iq.blur(); render(); focusScan(); }
      });
    }
    on('bIqX','click',function(){ APP.iq=''; APP.iqFocus=false; render(); focusScan(); });
    each('[data-cf]',function(b){b.addEventListener('click',function(){var key=b.getAttribute('data-cf');
      confirmTap(key,function(){ var t=key.slice(0,2), v=key.slice(2);
        if(t==='L:') resetLine(v); else if(t==='S:') voidStray(v); else if(t==='E:') voidOne(v); else if(t==='G:') voidGroup(v); });});});
    each('[data-kf]',function(b){b.addEventListener('click',function(){var f=b.getAttribute('data-kf'); APP.itemFilter=APP.itemFilter===f?'all':f; render();
      var sec=$('#itemsSec'); if(sec&&sec.scrollIntoView) sec.scrollIntoView({behavior:'smooth',block:'start'}); focusScan();});});
    if(APP.input==='camera'&&!APP.cam) camStart();
    if(APP.modal) bindModal();
    else if(APP.iqFocus&&$('#iq')){ var qi=$('#iq'); qi.focus(); try{qi.setSelectionRange(qi.value.length,qi.value.length);}catch(e){} }
    else setTimeout(focusScan,10);
    return;
  }
  if(APP.view==='sum'){
    var s=sess(APP.pl);
    on('bBackScan','click',function(){ if(s.submitted){leavePl();return;} APP.view='scan';startHeartbeat();render();});
    on('bBackScan2','click',function(){APP.view='scan';render();});
    on('bToList',  'click',leavePl);
    on('bToListC', 'click',leavePl);
    each('[data-rk]',function(sel){sel.addEventListener('change',function(){s.reasons[sel.getAttribute('data-rk')]=sel.value; lsSet('pchk_rs_'+APP.pl,s.reasons);});});
    on('bSubmit','click',submitPl);
    on('bExpCur','click',exportCurrent);
    on('cSep','change',function(e){ var s=sess(APP.pl); s.rejOkCount=e.target.checked?sepRejects(s).length:null; render(); });
  }
}
function bindModal(){
  var m=APP.modal;
  on('mClose','click',function(){APP.modal=null;render();});
  on('mCancel','click',function(){APP.modal=null;render();});
  on('mSave','click',saveEcer);
  if(m.type==='export'){
    each('[data-xm]',function(b){b.addEventListener('click',function(){m.mode=b.getAttribute('data-xm');render();});});
    each('[data-xs]',function(c){c.addEventListener('change',function(){m.sel[c.getAttribute('data-xs')]=c.checked;render();});});
    on('xAll','change',function(e){ var q=String(m.q||'').toLowerCase();
      Object.keys(m.sel).forEach(function(id){var p=plById(id); if(!q||(id+' '+(p?p.cust+' '+(p.ors||[]).join(' '):'')).toLowerCase().indexOf(q)>=0) m.sel[id]=e.target.checked;}); render(); });
    var xq=$('#xq');
    if(xq){ xq.addEventListener('input',function(){m.q=xq.value; m.qFocus=true; render();});
      if(m.qFocus){ xq.focus(); try{xq.setSelectionRange(xq.value.length,xq.value.length);}catch(e){} } }
    on('xGo','click',function(){ if(m.mode==='all') exportResults(null,'Semua');
      else { var ids=Object.keys(m.sel).filter(function(id){return m.sel[id];}); exportResults(ids,ids.length===1?('PL '+ids[0]):(ids.length+' PL')); } });
    return;
  }
  each('.modal input[data-k]',function(i){
    i.addEventListener('input',function(){m.vals[i.getAttribute('data-k')]=i.value;});
    i.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();saveEcer();}});
  });
  each('.modal [data-st]',function(b){b.addEventListener('click',function(){
    var k=b.getAttribute('data-k'), i=document.getElementById('e'+k), v=Math.max(0,(Number(i.value)||0)+Number(b.getAttribute('data-st'))); var mx=Number(i.max); if(isFinite(mx)) v=Math.min(v,mx); i.value=v; m.vals[k]=v;});});
}
var toastT=null;
function toast(t){var el=document.getElementById('toast'); if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);} el.textContent=t; el.classList.remove('hide'); clearTimeout(toastT); toastT=setTimeout(function(){el.classList.add('hide');},3200);}

document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') flush(); });
window.addEventListener('pagehide',function(){ flush(); });

(async function start(){
  render();
  try{
    DB = window.PCHK_MOCK_DB || await makeFirebaseDB();
  }catch(e){
    $('#app').innerHTML='<div class="login"><div class="card" style="padding:24px">Gagal memuat Firebase: '+esc(e.message||e)+'<br>Periksa koneksi internet.</div></div>';
    return;
  }
  DB.onAuth(function(me,msg){
    if(APP.unsubList){APP.unsubList();APP.unsubList=null;}
    APP.me=me;
    if(!me){ APP.view='login'; if(msg) APP.authMsg=msg; APP.pls=[]; render(); return; }
    APP.authMsg=''; APP.view='list'; render();
    APP.unsubList=DB.watchPicklists(function(list){
      list.forEach(ensureKeys); APP.pls=list; APP.plsErr='';
      if(APP.view==='list') render();
    },function(err){ APP.plsErr='Gagal memuat daftar PL: '+(err.code||err.message); if(APP.view==='list') render(); });
  });
})();
